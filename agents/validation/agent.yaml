name: validation
role: validation
version: 1.1.0
description: >-
  Final decision of every round: the fuzzy corridor [y_l, y_r] combined with the risk opinions of the other agents,
  weighted by their measured accuracy. Lowering below the corridor needs physical confirmation (video / gas);
  raising above it asks the operator. at_least opinions (a fall, a call for help) only raise.
entry: agent:CorridorValidationAgent
subscribes: []
publishes: []
backend: {kind: rules}
resources: {ram_mb: 0, gpu: false}
data_scope:
  events: []
  claims: ["*"]
timeout_s: 0.5
enabled_default: true
config:
  risk_terms: config/fuzzy/top.yaml    # levels of a combined risk = the HFS risk output terms
  require_physical: true               # lowering below the corridor needs video / gas (false: ablation only)
