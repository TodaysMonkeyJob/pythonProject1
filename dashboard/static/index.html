<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Guard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { --bg: #0f1115; --panel: #171a21; --line: #262a33; --text: #d7dae0; --muted: #8a909c;
          --low: #3fb950; --medium: #d29922; --high: #f0883e; --critical: #f85149; --accent: #58a6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--critical); display: inline-block; }
  .dot.on { background: var(--low); }
  main { display: grid; gap: 12px; padding: 12px; grid-template-columns: repeat(12, 1fr); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
            min-width: 0; display: flex; flex-direction: column; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  #camera { grid-column: span 7; } #status { grid-column: span 5; } #gpt { grid-column: span 5; }
  #gas { grid-column: span 7; } #speech { grid-column: span 4; } #log { grid-column: span 8; }
  #people { grid-column: span 12; } #devices { grid-column: span 12; } #locations { grid-column: span 12; }
  .locs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scroll-snap-type: x mandatory; }
  .loc { flex: 0 0 260px; scroll-snap-align: start; border-radius: 10px; padding: 10px; background: #12151b;
         border: 1px solid var(--line); border-top: 6px solid var(--low); display: flex; flex-direction: column; gap: 3px; }
  .loc.attention { border-top-color: var(--medium); } .loc.danger { border-top-color: var(--critical);
         background: rgba(248, 81, 73, .08); } .loc.offline { border-top-color: var(--muted); opacity: .7; }
  .loc .title { font-weight: 700; font-size: 15px; } .loc .st { font-weight: 700; text-transform: uppercase; font-size: 12px; }
  .loc.safe .st { color: var(--low); } .loc.attention .st { color: var(--medium); } .loc.danger .st { color: var(--critical); }
  #bell { position: relative; } #bell-count { position: absolute; top: -6px; right: -6px; background: var(--critical);
         color: #fff; border-radius: 9px; font-size: 11px; padding: 0 5px; }
  #notes { position: fixed; right: 12px; top: 48px; width: min(380px, 94vw); max-height: 70vh; overflow-y: auto; z-index: 20;
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: none; }
  .note { border-left: 4px solid var(--medium); padding: 4px 8px; margin-bottom: 6px; background: #12151b; }
  .note.danger { border-color: var(--critical); } .note.acked { opacity: .5; }
  #toasts { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--medium); border-radius: 6px;
           padding: 8px 12px; max-width: 360px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .toast.danger { border-left-color: var(--critical); }
  .devrow { display: grid; grid-template-columns: 18px minmax(140px, 1.4fr) 90px 90px minmax(150px, 1fr) 70px 110px;
            gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
  @media (max-width: 900px) { .devrow { grid-template-columns: 18px 1fr 1fr; } }
  .devrow.offline { opacity: .55; } #camera h2 select { margin-left: 8px; text-transform: none; }
  .cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  .card { background: #12151b; border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: flex;
          flex-direction: column; gap: 4px; min-width: 0; }
  .card img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; background: #000; }
  .card .name { font-weight: 600; cursor: text; overflow-wrap: anywhere; }
  .card .name:hover { color: var(--accent); }
  .card.unknown .name { color: var(--medium); }
  .card input { width: 100%; background: #0d1017; color: var(--text); border: 1px solid var(--accent);
                border-radius: 4px; padding: 2px 4px; font: inherit; }
  .card .buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .pname { font-weight: 600; }
  @media (max-width: 900px) { main > section { grid-column: span 12 !important; } }
  #camera img { width: 100%; border-radius: 6px; background: #000; aspect-ratio: 4 / 3; object-fit: contain; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .kv span:nth-child(odd) { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  td { padding: 2px 4px; border-top: 1px solid var(--line); }
  .list { overflow-y: auto; max-height: 340px; font-size: 13px; }
  .row { padding: 3px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .row time { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .sev-warning { color: var(--medium); } .sev-critical { color: var(--critical); font-weight: 600; }
  .row.sev-critical { background: rgba(248, 81, 73, .08); }
  .filters { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  select, button { background: #0d1017; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                   padding: 3px 8px; font: inherit; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  .decision { border-left: 4px solid var(--muted); padding: 6px 8px; margin-bottom: 8px; background: #12151b; }
  .decision.low { border-color: var(--low); } .decision.medium { border-color: var(--medium); }
  .decision.high { border-color: var(--high); } .decision.critical { border-color: var(--critical); }
  .badge { font-weight: 700; text-transform: uppercase; font-size: 12px; margin-right: 6px; }
  .low .badge { color: var(--low); } .medium .badge { color: var(--medium); }
  .high .badge { color: var(--high); } .critical .badge { color: var(--critical); }
  .muted { color: var(--muted); } ul { margin: 4px 0 4px 18px; padding: 0; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
           width: min(760px, 94vw); }
  dialog pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #0d1017; padding: 8px;
               border-radius: 6px; max-height: 60vh; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<header><span id="ws-dot" class="dot" title="WebSocket"></span><h1>IoT Guard</h1>
  <span id="mic" class="muted"></span><span id="clock" class="muted" style="margin-left:auto"></span>
  <button id="bell" title="сповіщення">🔔<span id="bell-count" hidden></span></button></header>
<div id="notes"><div class="filters"><b style="flex:1">Сповіщення</b><button id="browser-notify">Сповіщення браузера</button></div>
  <div id="note-list"><div class="muted">немає</div></div></div>
<div id="toasts"></div>
<main>
  <section id="locations"><h2>Локації <button id="manage-locs" style="margin-left:8px">керувати</button></h2>
    <div class="locs" id="loc-cards"><div class="muted">немає даних</div></div></section>
  <section id="camera"><h2>Камера <select id="cam-select" title="камера"></select></h2>
    <img id="video" src="/video" alt="camera stream"></section>
  <section id="status"><h2>Стан системи</h2><div class="kv" id="status-kv"></div>
    <table><tbody id="modules"></tbody></table></section>
  <section id="gpt"><h2>Рішення GPT</h2><div class="list" id="decisions"><div class="muted">ще немає</div></div></section>
  <section id="gas"><h2>Газ, останні 10 хв</h2><canvas id="gas-chart" height="140"></canvas>
    <div id="gas-now" class="muted"></div></section>
  <section id="speech"><h2>Транскрипти</h2><div class="list" id="transcripts"></div></section>
  <section id="log"><h2>Журнал подій</h2>
    <div class="filters">
      <select id="f-source"><option value="">усі джерела</option><option>camera</option><option>audio</option>
        <option>gas</option><option>system</option><option>llm</option></select>
      <select id="f-severity"><option value="">усі рівні</option><option>info</option><option>warning</option>
        <option>critical</option></select>
    </div>
    <div class="list" id="events"></div></section>
  <section id="devices"><h2>Пристрої <span class="muted">(знайдені автоматично; оберіть локацію, вимкніть зайве)</span></h2>
    <div class="filters"><button id="pair-phone">Підключити телефон</button><button id="add-rtsp">IP-камера (RTSP)</button>
      <button id="onvif">Пошук ONVIF</button></div>
    <div id="device-list"><div class="muted">немає даних</div></div></section>
  <section id="people"><h2>Люди <span class="muted">(клікніть ім'я, щоб перейменувати — зміниться всюди)</span></h2>
    <div class="cards" id="cards"><div class="muted">реєстр порожній</div></div></section>
</main>
<dialog id="dlg"><h3 id="dlg-title"></h3><div id="dlg-body"></div>
  <form method="dialog"><button>Закрити</button></form></dialog>
<script>
const MAX_ROWS = 500, GAS_WINDOW_MS = 10 * 60 * 1000;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text; return e; };   // textContent only: event text is never HTML
const hms = (ts) => new Date(ts).toLocaleTimeString("uk-UA", { hour12: false });
let thresholds = {};

// --- people (F9): names are looked up by person_id at render time, so a rename also changes old lines
let persons = {}, aliases = {};
const livePid = (pid) => aliases[pid] || pid;
const personName = (pid, fallback) => (persons[livePid(pid)] || {}).display_name || fallback || "?";
function nameSpan(pid, fallback) {
  const s = el("span", "pname", personName(pid, fallback));
  if (pid) { s.dataset.pid = pid; s.dataset.fallback = fallback || ""; }
  return s;
}
function renderNames() {
  document.querySelectorAll(".pname[data-pid]").forEach((s) => { s.textContent = personName(s.dataset.pid, s.dataset.fallback); });
}

function describe(ev) {
  const p = ev.payload;
  switch (ev.type) {
    case "object_detected": return `#${p.track_id} ${p.class} ${p.state}`;
    case "person_identified": return [`#${p.track_id ?? "—"} `, nameSpan(p.person_id, p.identity),
                                      p.previous ? ` (було ${p.previous})` : ""];
    case "action": return `#${p.track_id} ${p.action}${p.gas_confirmed ? " + газ" : ""}`;
    case "speech": return p.person_id ? [nameSpan(p.person_id, p.speaker_name || p.speaker), `: "${p.text}"`]
                                      : `${p.speaker_status === "uncertain" ? "?: " : ""}"${p.text}"`;
    case "sound": return `${p.rms_db} dB`;
    case "gas_reading": return `${p.gas} ${p.concentration_pct}% ${p.trend}`;
    case "alert": return [p.reason, p.gas || p.module || ""].join(" ");
    case "mic_state": return `${p.state} (${p.reason})`;
    case "scene_active": return p.active ? "активна" : "порожня";
    case "llm_decision": return `${p.risk_level}: ${p.summary}`;
    case "identity_renamed": return [nameSpan(p.person_id, p.display_name), ` (було ${p.previous})`];
    case "identity_merged": case "identity_linked":
      return [`${p.source_name || ""} → `, nameSpan(p.person_id, p.display_name), p.modality ? ` (${p.modality})` : ""];
    case "location_state_changed": return `${p.location_id}: ${p.from} → ${p.to} (${p.reason})`;
    case "notification": return `${p.title}: ${p.body}`;
    case "device_online": case "device_offline": case "device_updated":
      return `${KIND[p.kind] || p.kind} ${p.name} · ${p.location_id}${p.enabled === false ? " (вимкнено)" : ""}`;
    case "identity_created": case "identity_deleted": return `${p.display_name}${p.modality ? " (" + p.modality + ")" : ""}`;
    default: return JSON.stringify(p).slice(0, 160);
  }
}

function prepend(list, node) { list.prepend(node); while (list.children.length > MAX_ROWS) list.lastChild.remove(); }

function addLogRow(ev) {
  if (ev.type === "gas_reading" && ev.severity === "info") return;   // routine readings go to the chart
  const row = el("div", "row sev-" + ev.severity);
  row.dataset.source = ev.source; row.dataset.severity = ev.severity;
  const text = el("span"); text.append(...[].concat(describe(ev)));   // strings become text nodes
  row.append(el("time", "", hms(ev.timestamp)), el("b", "", ev.source + " " + ev.type + " "), text);
  applyFilter(row); prepend($("events"), row);
}

function applyFilter(row) {
  const s = $("f-source").value, v = $("f-severity").value;
  row.style.display = (!s || row.dataset.source === s) && (!v || row.dataset.severity === v) ? "" : "none";
}
for (const id of ["f-source", "f-severity"]) $(id).onchange = () => [...$("events").children].forEach(applyFilter);

function addTranscript(ev) {
  const row = el("div", "row");
  const p = ev.payload, where = [p.location_id, p.device_id].filter(Boolean).join(" · ");
  row.append(el("time", "", hms(p.start || ev.timestamp)), el("span", "muted", (where ? `[${where}] ` : "") + (p.language || "") + " "));
  if (p.person_id) {
    const who = nameSpan(p.person_id, p.speaker_name || p.speaker);
    if (p.speaker_score !== undefined) who.title = `${p.speaker_status}, score ${p.speaker_score}`;
    row.append(who, document.createTextNode(": "));
  } else if (p.speaker_status === "uncertain") row.append(el("span", "muted", "?: "));
  row.append(el("span", "", p.text));
  prepend($("transcripts"), row);
}

function addDecision(ev) {
  const p = ev.payload, box = $("decisions");
  if (box.firstChild && box.firstChild.classList.contains("muted")) box.firstChild.remove();
  const d = el("div", "decision " + p.risk_level);
  const head = el("div");
  head.append(el("span", "badge", p.risk_level), el("b", "", p.recommended_action + " "),
              el("time", "muted", hms(ev.timestamp)));
  const reasons = el("ul"); (p.reasons || []).forEach((r) => reasons.append(el("li", "", r)));
  d.append(head, el("div", "", p.summary), reasons);
  if (p.follow_up) d.append(el("div", "muted", "→ " + p.follow_up));
  const actions = el("div", "muted", `${p.model || ""} · ${p.prompt_tokens}+${p.completion_tokens} ток. · $${p.cost_usd} `);
  const btn = el("button", "", "знімок"); btn.onclick = () => showSnapshot(p.snapshot_id); actions.append(btn);
  if (p.incident_id) { const a = el("a", "", " архів інциденту"); a.href = "/api/incident/" + encodeURIComponent(p.incident_id);
    a.style.color = "var(--accent)"; actions.append(a); }
  d.append(actions); prepend(box, d);
  while (box.children.length > 20) box.lastChild.remove();
}

async function showSnapshot(id) {
  const r = await fetch("/api/snapshot/" + encodeURIComponent(id));
  $("dlg-title").textContent = "Знімок " + id; const body = $("dlg-body"); body.replaceChildren();
  if (!r.ok) { body.append(el("p", "", "не знайдено")); }
  else { const j = await r.json();
    body.append(el("p", "muted", "Надіслано в GPT (текст):"), el("pre", "", j.digest_sent_to_gpt || "—"),
                el("p", "muted", "Повний знімок (JSON, лишається локально):"), el("pre", "", JSON.stringify(j.snapshot, null, 1))); }
  $("dlg").showModal();
}

// --- gas chart
const gas = { labels: [], values: [], times: [], gasName: null };
const chart = typeof Chart === "undefined" ? null : new Chart($("gas-chart"), {
  type: "line",
  data: { labels: gas.labels, datasets: [
    { label: "концентрація, %", data: gas.values, borderColor: "#58a6ff", pointRadius: 0, tension: .2 },
    { label: "поріг", data: [], borderColor: "#f85149", borderDash: [6, 4], pointRadius: 0 } ] },
  options: { animation: false, responsive: true, scales: { x: { ticks: { color: "#8a909c", maxTicksLimit: 8 } },
    y: { ticks: { color: "#8a909c" }, beginAtZero: true } }, plugins: { legend: { labels: { color: "#d7dae0" } } } }
});
if (!chart) $("gas-now").textContent = "Chart.js недоступний (немає інтернету) — показую лише поточне значення.";

function addGas(ev) {
  const p = ev.payload, t = Date.parse(ev.timestamp);
  gas.times.push(t); gas.labels.push(hms(ev.timestamp)); gas.values.push(p.concentration_pct); gas.gasName = p.gas;
  while (gas.times.length && t - gas.times[0] > GAS_WINDOW_MS) { gas.times.shift(); gas.labels.shift(); gas.values.shift(); }
  $("gas-now").textContent = `зараз: ${p.gas} ${p.concentration_pct}% (${p.trend}), впевненість ${p.gas_confidence}`;
  if (chart) { const limit = thresholds[p.gas];
    chart.data.datasets[1].data = limit === undefined ? [] : gas.values.map(() => limit);
    chart.data.datasets[1].label = limit === undefined ? "поріг" : `поріг ${p.gas} ${limit}%`; chart.update("none"); }
}

function handle(ev) {
  addLogRow(ev);
  if (ev.type === "speech") addTranscript(ev);
  else if (ev.type === "llm_decision") addDecision(ev);
  else if (ev.type === "gas_reading") addGas(ev);
  else if (ev.type === "mic_state") $("mic").textContent = "мікрофон: " + ev.payload.state;
  else if (ev.type.startsWith("device_")) loadDevices();
  else if (ev.type === "notification") { toast(ev.payload); loadNotes(); }
  else if (ev.type === "notification_acked") loadNotes();
  else if (ev.type.startsWith("identity_")) {
    const p = ev.payload;
    if (ev.type === "identity_renamed" && persons[p.person_id]) { persons[p.person_id].display_name = p.display_name; renderNames(); }
    loadPersons();
  }
}

// --- People page: rename inline, merge, delete (the single rename point; every module follows)
async function api(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" },
                               body: body === undefined ? undefined : JSON.stringify(body) });
  if (!r.ok) { let msg = r.status + ""; try { msg = (await r.json()).detail || msg; } catch (e) { /* not JSON */ }
    alert(msg); return null; }
  return r.json();
}
let loading = null;
async function loadPersons() {
  if (loading) return loading;
  loading = (async () => {
    try { const r = await fetch("/api/persons"); if (!r.ok) return;
      const j = await r.json(); persons = {}; aliases = j.aliases || {};
      j.persons.forEach((p) => { persons[p.person_id] = p; }); renderNames(); renderPeople(j.persons);
    } catch (e) { /* server restarting */ } finally { loading = null; }
  })();
  return loading;
}
function editName(card, p) {
  const name = card.querySelector(".name"), input = el("input"); input.value = p.display_name;
  input.onkeydown = async (e) => {
    if (e.key === "Escape") { input.replaceWith(name); return; }
    if (e.key !== "Enter") return;
    const value = input.value.trim(); if (!value || value === p.display_name) { input.replaceWith(name); return; }
    if (await api("PATCH", "/api/persons/" + encodeURIComponent(p.person_id), { display_name: value })) {
      persons[p.person_id].display_name = value; renderNames(); loadPersons(); }
  };
  input.onblur = () => { if (input.isConnected) input.replaceWith(name); };
  name.replaceWith(input); input.focus(); input.select();
}
function renderPeople(list) {
  const box = $("cards");
  if (box.contains(document.activeElement) && document.activeElement.tagName === "INPUT") return;  // editing a name
  box.replaceChildren();
  if (!list.length) { box.append(el("div", "muted", "реєстр порожній")); return; }
  for (const p of list) {
    const card = el("div", "card" + (p.is_known ? "" : " unknown"));
    const img = el("img"); img.alt = p.display_name; img.loading = "lazy";
    img.src = "/api/persons/" + encodeURIComponent(p.person_id) + "/thumbnail?v=" + (p.has_thumbnail ? p.face_samples : 0);
    const name = el("div", "name", p.display_name); name.title = "клікніть, щоб перейменувати"; name.onclick = () => editName(card, p);
    const seen = p.last_seen ? `${hms(p.last_seen)} ${new Date(p.last_seen).toLocaleDateString("uk-UA")} · ${p.last_location || ""}` : "—";
    const merge = el("select"); merge.append(el("option", "", "Об'єднати з…"));
    list.filter((o) => o.person_id !== p.person_id).forEach((o) => { const opt = el("option", "", o.display_name); opt.value = o.person_id; merge.append(opt); });
    merge.onchange = async () => { const target = merge.value; if (!persons[target]) return;
      if (confirm(`${p.display_name} → ${persons[target].display_name}: це одна людина? Обличчя й голос будуть об'єднані.`)
          && await api("POST", "/api/persons/" + encodeURIComponent(p.person_id) + "/merge", { target_id: target })) loadPersons();
      else merge.selectedIndex = 0; };
    const del = el("button", "", "Видалити");
    del.onclick = async () => { if (confirm(`Видалити ${p.display_name} разом з усіма зразками обличчя й голосу?`)
      && await api("DELETE", "/api/persons/" + encodeURIComponent(p.person_id))) loadPersons(); };
    const buttons = el("div", "buttons"); buttons.append(merge, del);
    card.append(img, name, el("div", "muted", `обличчя: ${p.face_samples} · голос: ${p.voice_samples}`),
                el("div", "muted", "востаннє: " + seen), buttons);
    box.append(card);
  }
}

// --- websocket with auto-reconnect
let delay = 1000;
function connect() {
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => { $("ws-dot").classList.add("on"); delay = 1000;
    $("events").replaceChildren(); $("transcripts").replaceChildren(); };
  ws.onmessage = (m) => { try { const ev = JSON.parse(m.data);
    if (ev.type === "location_summary") { summaries[ev.payload.location_id] = ev.payload; renderLocations(); return; }
    handle(ev); } catch (e) { console.warn(e); } };
  ws.onclose = () => { $("ws-dot").classList.remove("on"); setTimeout(connect, delay); delay = Math.min(delay * 2, 15000); };
}
connect();

// --- status every 2 s
async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json(); thresholds = s.gas_thresholds || {};
    const kv = $("status-kv"); kv.replaceChildren();
    const fmt = (v, unit = "") => v === null || v === undefined ? "—" : v + unit;
    for (const [k, v] of [["мікрофон", fmt(s.mic_state)], ["відео FPS", fmt(s.video_fps)], ["YOLO FPS", fmt(s.yolo_fps)],
                          ["CPU", fmt(s.cpu_percent, "%")], ["температура CPU", fmt(s.cpu_temp_c, " °C")],
                          ["RAM", `${s.ram_used_mb} / ${s.ram_total_mb} MB`], ["аптайм", fmt(s.uptime_sec, " с")]])
      kv.append(el("span", "", k), el("span", "", v));
    if (s.mic_state) $("mic").textContent = "мікрофон: " + s.mic_state;
    const rows = $("modules"); rows.replaceChildren();
    for (const [name, m] of Object.entries(s.modules)) {
      const tr = el("tr"); const dot = el("span", "dot" + (m.alive ? " on" : ""));
      const c1 = el("td"); c1.append(dot, document.createTextNode(" " + name));
      tr.append(c1, el("td", "muted", m.alive ? `${m.age_sec} с тому` : `немає heartbeat ${m.age_sec} с`)); rows.append(tr);
    }
  } catch (e) { /* server restarting */ }
}
refreshStatus(); setInterval(refreshStatus, 2000);
loadPersons(); setInterval(loadPersons, 30000);   // CLI edits are not on the bus

// --- devices (F11): every camera / mic / sensor, its location and whether it runs
let deviceData = { devices: [], locations: [] }, chosenCamera = null;
const KIND = { camera: "камера", mic: "мікрофон", gas: "газ" };
async function loadDevices() {
  try { const r = await fetch("/api/devices"); if (!r.ok) return; deviceData = await r.json(); renderDevices(); }
  catch (e) { /* server restarting */ }
}
function renderDevices() {
  const box = $("device-list");
  if (box.contains(document.activeElement) && document.activeElement.tagName === "SELECT") return;
  box.replaceChildren();
  if (!deviceData.devices.length) { box.append(el("div", "muted", "пристроїв ще немає (network.discovery: true)")); }
  for (const d of deviceData.devices) {
    const row = el("div", "devrow" + (d.status === "online" ? "" : " offline"));
    const dot = el("span", "dot" + (d.running ? " on" : "")); dot.title = d.running ? "працює" : d.status;
    const name = el("span", "", d.name); name.title = d.device_id;
    const loc = el("select");
    for (const l of deviceData.locations) { const o = el("option", "", l.name); o.value = l.location_id; loc.append(o); }
    const add = el("option", "", "+ нова локація…"); add.value = "__new"; loc.append(add);
    loc.value = d.location_id;
    loc.onchange = async () => {
      let id = loc.value;
      if (id === "__new") { const n = prompt("Назва локації (напр. Кімната B)"); if (!n) { loc.value = d.location_id; return; }
        const created = await api("POST", "/api/locations", { name: n }); if (!created) return; id = created.location_id; }
      if (await api("PATCH", "/api/devices/" + encodeURIComponent(d.device_id), { location_id: id })) loadDevices();
    };
    const on = el("input"); on.type = "checkbox"; on.checked = d.enabled; on.title = "увімкнено";
    on.onchange = async () => { if (await api("PATCH", "/api/devices/" + encodeURIComponent(d.device_id), { enabled: on.checked })) loadDevices(); };
    const state = d.status !== "online" ? d.status : d.kind === "camera" ? (d.fps ? d.fps + " FPS" : "старт…")
                : d.kind === "mic" ? (d.mic_state || "старт…") : "online";
    const label = el("label", "muted"); label.append(on, document.createTextNode(" увімк."));
    row.append(dot, name, el("span", "muted", KIND[d.kind] || d.kind), el("span", "muted", d.transport), loc, label,
               el("span", "muted", state));
    box.append(row);
  }
  const select = $("cam-select"), cams = deviceData.devices.filter((d) => d.kind === "camera" && d.status === "online");
  select.style.display = cams.length > 1 ? "" : "none";
  const current = select.value; select.replaceChildren();
  cams.forEach((c) => { const o = el("option", "", `${c.name} · ${c.location_id}`); o.value = c.device_id; select.append(o); });
  if (cams.some((c) => c.device_id === current)) select.value = current;
}
$("pair-phone").onclick = async () => {
  const j = await api("POST", "/api/pairing-code"); if (!j) return;
  $("dlg-title").textContent = "Підключити телефон або ноутбук"; const body = $("dlg-body"); body.replaceChildren();
  const code = el("div", "", j.code); code.style.cssText = "font-size:40px;font-weight:700;letter-spacing:.2em";
  body.append(el("p", "", "1. На телефоні в тій самій Wi-Fi мережі відкрийте:"), el("pre", "", deviceData.node_url || "https://<ip-хаба>:8443/node"),
              el("p", "muted", "Браузер попередить про самопідписаний сертифікат — це сертифікат вашого хаба, підтвердіть."),
              el("p", "", "2. Введіть код (дійсний 10 хв):"), code, el("p", "", "3. Оберіть локацію й натисніть «Почати трансляцію»."));
  $("dlg").showModal();
};
$("add-rtsp").onclick = async () => {
  const url = prompt("RTSP-адреса камери, напр. rtsp://user:pass@192.168.0.50:554/stream1"); if (!url) return;
  const name = prompt("Назва камери", "IP камера") || "IP камера";
  if (await api("POST", "/api/devices/rtsp", { name, url })) loadDevices();
};
$("onvif").onclick = async () => {
  $("dlg-title").textContent = "Пошук IP-камер (ONVIF)"; const body = $("dlg-body"); body.replaceChildren(el("p", "muted", "шукаю 3 с…"));
  $("dlg").showModal();
  const j = await api("POST", "/api/devices/onvif-scan"); body.replaceChildren(); if (!j) return;
  if (!j.found.length) body.append(el("p", "", "Нічого не знайдено. Камера має підтримувати ONVIF і бути в тій самій мережі."));
  for (const f of j.found) body.append(el("p", "", `${f.name || "камера"} ${f.hardware || ""} — ${f.host} (${f.address})`));
  if (j.found.length) body.append(el("p", "muted", "Додайте камеру кнопкою «IP-камера (RTSP)» з її RTSP-адресою (див. інструкцію камери)."));
};
$("cam-select").onchange = () => { chosenCamera = $("cam-select").value;
  $("video").src = "/video?device=" + encodeURIComponent(chosenCamera); };
loadDevices(); setInterval(loadDevices, 5000);

// --- locations (F12): live state per territory, notifications
const STATE = { safe: "безпечно", attention: "увага", danger: "небезпека", offline: "офлайн" };
let locationList = [], summaries = {};
async function loadLocations() {
  try { const r = await fetch("/api/locations"); if (!r.ok) return; const j = await r.json(); locationList = j.locations;
    j.locations.forEach((l) => { if (l.summary) summaries[l.location_id] = l.summary; }); renderLocations(); } catch (e) { /* restarting */ }
}
function renderLocations() {
  const box = $("loc-cards"); box.replaceChildren();
  const ids = locationList.map((l) => l.location_id);
  Object.keys(summaries).forEach((id) => { if (!ids.includes(id)) ids.push(id); });
  if (!ids.length) { box.append(el("div", "muted", "локацій ще немає")); return; }
  for (const id of ids) {
    const meta = locationList.find((l) => l.location_id === id) || { name: id, icon: "" }, s = summaries[id];
    const state = s ? s.state : "safe", card = el("div", "loc " + state);
    card.append(el("div", "title", `${meta.icon || ""} ${s ? s.name : meta.name}`.trim()), el("div", "st", STATE[state] || state));
    if (s) {
      if (s.reason) card.append(el("div", "", s.reason));
      card.append(el("div", "muted", `людей: ${s.people_count}${s.people.length ? " — " + s.people.map((p) => (p.name || "?") + (p.action ? " " + p.action : "")).join(", ") : ""}`));
      if (s.last_speech) card.append(el("div", "muted", `${s.last_speech.name}: "${s.last_speech.text}"`));
      if (s.gas) card.append(el("div", "muted", `газ: ${s.gas.main} ${s.gas.trend || ""}`));
      card.append(el("div", "muted", `пристрої: ${s.devices.online}/${s.devices.total}`));
      if (s.last_llm) card.append(el("div", "muted", `GPT: ${s.last_llm.risk_level} — ${s.last_llm.summary}`));
      if (s.active_alerts) { const b = el("button", "", `Підтвердити (${s.active_alerts})`);
        b.onclick = async () => { if (await api("POST", `/api/locations/${encodeURIComponent(id)}/ack`)) loadNotes(); }; card.append(b); }
    } else card.append(el("div", "muted", "очікую дані…"));
    box.append(card);
  }
}
function toast(note) {
  const t = el("div", "toast " + note.level); t.append(el("b", "", note.title), el("div", "", note.body));
  $("toasts").append(t); setTimeout(() => t.remove(), 8000);
  try { if (window.Notification && Notification.permission === "granted") new Notification(note.title, { body: note.body, tag: note.id }); }
  catch (e) { /* not supported */ }
}
async function loadNotes() {
  try { const r = await fetch("/api/notifications?limit=50"); if (!r.ok) return; const j = await r.json(); renderNotes(j.notifications); }
  catch (e) { /* restarting */ }
}
function renderNotes(list) {
  const box = $("note-list"); box.replaceChildren(); const open = list.filter((n) => !n.acknowledged_at).length;
  $("bell-count").hidden = !open; $("bell-count").textContent = open;
  if (!list.length) { box.append(el("div", "muted", "немає")); return; }
  for (const n of list) {
    const row = el("div", "note " + n.level + (n.acknowledged_at ? " acked" : ""));
    row.append(el("b", "", n.title), el("div", "", n.body),
               el("div", "muted", new Date(n.ts * 1000).toLocaleString("uk-UA") + " · " + n.channels.join(", ") +
                  (n.acknowledged_at ? ` · підтвердив ${n.acknowledged_by}` : "")));
    if (!n.acknowledged_at) { const b = el("button", "", "Підтвердити");
      b.onclick = async () => { if (await api("POST", `/api/notifications/${encodeURIComponent(n.id)}/ack`)) loadNotes(); }; row.append(b); }
    box.append(row);
  }
}
$("bell").onclick = () => { const p = $("notes"); p.style.display = p.style.display === "block" ? "none" : "block"; loadNotes(); };
$("browser-notify").onclick = async () => { if (window.Notification) await Notification.requestPermission(); };
$("manage-locs").onclick = () => {
  $("dlg-title").textContent = "Локації"; const body = $("dlg-body"); body.replaceChildren();
  const list = el("div"); body.append(list);
  const draw = () => {
    list.replaceChildren();
    locationList.forEach((l, i) => {
      const row = el("div", "devrow"); row.style.gridTemplateColumns = "60px 1fr 90px 130px 110px";
      const icon = el("input"); icon.value = l.icon || ""; icon.placeholder = "📦"; icon.maxLength = 4;
      const name = el("input"); name.value = l.name;
      const after = el("input"); after.value = (l.rules || {}).unknown_person_after || ""; after.placeholder = "20:00"; after.title = "невідомий після";
      const save = el("button", "", "Зберегти");
      save.onclick = async () => { await api("PATCH", `/api/locations/${encodeURIComponent(l.location_id)}`,
        { name: name.value, icon: icon.value, rules: { ...(l.rules || {}), unknown_person_after: after.value || null } }); await loadLocations(); draw(); };
      const tools = el("span");
      const up = el("button", "", "↑"); up.disabled = i === 0 || l.location_id === "unassigned";
      up.onclick = async () => { const ids = locationList.map((x) => x.location_id); [ids[i - 1], ids[i]] = [ids[i], ids[i - 1]];
        await api("POST", "/api/locations/reorder", { order: ids }); await loadLocations(); draw(); };
      const del = el("button", "", "✕"); del.disabled = l.location_id === "unassigned";
      del.onclick = async () => { if (confirm(`Видалити ${l.name}? Пристрої перейдуть у «Unassigned».`) &&
        await api("DELETE", `/api/locations/${encodeURIComponent(l.location_id)}`)) { await loadLocations(); loadDevices(); draw(); } };
      tools.append(up, del);
      row.append(icon, name, after, save, tools); list.append(row);
    });
    const add = el("button", "", "+ локація");
    add.onclick = async () => { const n = prompt("Назва локації"); if (n && await api("POST", "/api/locations", { name: n })) { await loadLocations(); draw(); } };
    list.append(add);
  };
  draw(); $("dlg").showModal();
};
loadLocations(); loadNotes(); setInterval(loadLocations, 10000);
setInterval(() => $("clock").textContent = new Date().toLocaleTimeString("uk-UA", { hour12: false }), 1000);
</script>
