<!doctype html>
<html lang="uk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IoT Guard</title>
<link rel="stylesheet" href="/static/app/app.css">
</head>
<body>
<header id="topbar">
  <span id="ws-dot" class="dot" title="з'єднання з хабом"></span>
  <b class="brand">IoT Guard</b>
  <span id="site" class="site" title="загальний стан"></span>
  <span id="clock" class="muted"></span>
  <span id="cams-online" class="muted"></span>
  <a id="dups" class="dups" href="#/people" hidden title="можливі дублікати людей — перевірте на сторінці «Люди»"></a>
  <nav id="nav">
    <a href="#/overview">Огляд</a><a href="#/people">Люди</a><a href="#/devices">Пристрої</a><a href="#/locations">Локації</a>
  </nav>
  <button id="bell" title="сповіщення">🔔<span id="bell-count" hidden></span></button>
  <button id="theme" title="світла / темна тема">◐</button>
</header>
<main id="view" class="view"></main>
<nav id="dots" class="dots" aria-label="сторінки"></nav>
<dialog id="notes" class="notes"><div class="row"><b>Сповіщення</b>
  <form method="dialog"><button>✕</button></form></div><div id="note-list"></div></dialog>
<div id="toasts"></div>
<dialog id="dlg"><h3 id="dlg-title"></h3><div id="dlg-body"></div><form method="dialog"><button>Закрити</button></form></dialog>
<script type="module" src="/static/app/main.js"></script>
<!-- Live data: /ws (events, location summaries), /ws/video (camera frames), /api/* — no CDN, works offline -->
</body>
</html>
