  - {id: x06, group: combined, camera: {unknown: 1, motion: 0.03, time: "23:00"},
     audio: {intensity: 14, speech: {text: "допоможіть", speaker: unknown}}, label: critical,
     why: "a stranger at night and a call for help"}
  - {id: x07, group: combined, gas: [{gas: ammonia, value: 90, unit: ppm}], offline: [mic], label: medium,
     why: "gas medium, microphone offline: partial, still medium"}
  - {id: x08, group: combined, gas: [{gas: ammonia, value: 90, unit: ppm}], camera: {unknown: 1, motion: 0.03},
