  - {id: a08, group: audio, audio: {intensity: 4, sound: {type: scream, danger: 0.8, confidence: 0.9}},
     label: medium, why: "a faint scream far away"}
  - {id: a09, group: audio, audio: {intensity: 25, sound: {type: keyboard, danger: 0.0, confidence: 0.9}},
     label: low, why: "loud typing"}
  - {id: a10, group: audio, audio: {intensity: 25, sound: {type: unknown, danger: 0.3, confidence: 0.4}},
     label: medium, why: "a loud unidentified sound (supervisor's example: high + suspicious → medium)"}
  - {id: a11, group: audio, audio: {intensity: 25, sound: {type: glass_breaking, danger: 0.9, confidence: 0.9}},
     label: high, why: "loud breaking glass"}
  - {id: a12, group: audio, audio: {intensity: 2, speech: {text: "", speaker: known}}, label: low,
