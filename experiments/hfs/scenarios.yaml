  - {id: c07, group: camera, camera: {known: 1, unknown: 2, motion: 0.2, time: "11:00"}, label: high,
     why: "mostly strangers moving a lot (supervisor's example: most + high motion → high)"}
  - {id: c08, group: camera, camera: {motion: 0.2, time: "02:00"}, label: medium,
     why: "sustained motion at night with nobody identified: someone the camera cannot see well"}
  - {id: c09, group: camera, camera: {known: 1, motion: 0.05, time: "22:00"}, label: low,
     why: "an employee working late"}
  - {id: c10, group: camera, camera: {unknown: 1, motion: 0.03, time: "19:30"}, label: high,
