  # --- combinations / top level ---------------------------------------------------------------------------------
  - {id: x01, group: combined, gas: [{gas: ammonia, value: 180, unit: ppm}],
     camera: {unknown: 1, motion: 0.0, time: "23:00"}, label: critical,
     why: "gas high and a stranger at night high: two independent highs → critical"}
  - {id: x02, group: combined, gas: [{gas: ammonia, value: 90, unit: ppm}],
