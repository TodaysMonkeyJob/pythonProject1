  - {id: c12, group: camera, camera: {motion: 0.004, time: "03:00"}, label: low,
     why: "sensor-level noise of the adaptive detector at night (no one there)"}
  # --- microphone (subsystem 3) ---------------------------------------------------------------------------------
  - {id: a01, group: audio, label: low, why: "quiet room"}
