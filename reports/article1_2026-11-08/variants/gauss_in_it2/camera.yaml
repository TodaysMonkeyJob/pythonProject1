version: 2
output: risk
update_sec: 1
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  unknown_share:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: N_unknown / (N_unknown + N_known) in view — a share, not a head count (supervisor, slides 9–11)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      none:
      - gauss
      - 0.0
      - 0.14863131505040333
      part:
      - gauss
      - 0.3
      - 0.1167817475396026
      most:
      - gauss
      - 0.6
      - 0.13801479254680307
      all:
      - gauss
      - 1.0
      - 0.19109740506480435
  motion_intensity:
    universe:
    - 0
    - 1
    - 0.001
    source:
      universe:
        kind: design
        text: moving share of the frame 0..1 (adaptive detector, smoothed 5 s)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      none:
      - gauss
      - 0.0
      - 0.005520591701872125
      low:
      - gauss
      - 0.01
      - 0.009979531153384224
      medium:
      - gauss
      - 0.05
      - 0.02972626301008067
      high:
      - gauss
      - 1.0
      - 0.7643896202592172
  activity_time:
    universe:
    - -12
    - 12
    - 0.05
    source:
      universe:
        kind: design
        text: signed hours to the nearest change of the location's schedule, ±12 h (core/schedule.py)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    unit: h
    default: -12
    terms:
      working:
      - gauss
      - -12.0
      - 9.76720070331222
      transition:
      - gauss
      - 0.0
      - 0.42466090014400953
      off_hours:
      - gauss
      - 12.0
      - 9.76720070331222
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: equal areas, see gas.risk
    terms:
      low:
      - trap
      - 0
      - 0
      - 0.125
      - 0.375
      medium:
      - tri
      - 0.1
      - 0.35
      - 0.6
      high:
      - tri
      - 0.4
      - 0.65
      - 0.9
      critical:
      - trap
      - 0.625
      - 0.875
      - 1
      - 1
rules:
- id: C000
  rule: IF unknown_share IS none AND motion_intensity IS none AND activity_time IS working THEN risk IS low
  meta:
    source: A3 (TOD-43), modules/hfs/policy.py camera()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: 'Strangers matter by their share and by the location''s schedule, not by head count or actions: part → low,
      most → medium, all → medium in working hours and high around / after them; high motion → one level up with anybody unknown
      in view (or after hours with nobody unknown: medium).'
- id: C001
  rule: IF unknown_share IS none AND motion_intensity IS none AND activity_time IS transition THEN risk IS low
  meta:
    source: A3 (TOD-43), modules/hfs/policy.py camera()
    author: TodaysMonkeyJob
