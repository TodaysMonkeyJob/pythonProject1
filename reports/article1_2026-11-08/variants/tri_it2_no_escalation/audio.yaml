version: 2
output: risk
update_sec: 1
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  intensity:
    universe:
    - 0
    - 40
    - 0.1
    source:
      universe:
        kind: design
        text: dB above this microphone's own background (modules/audio/intensity.py), 0..40 dB
      terms:
        kind: normative
        text: 'medium peak +10 dB = normal speech (ANSI S3.5-1997: 62.35 dB at 1 m) heard at ~4 m (−12 dB) over a quiet 40
          dB room; high from +20 dB = raised / loud voice (68.34 / 74.85 dB) or a shout (82.30 dB); low ≤ +3 dB = background
          fluctuation (expert)'
    unit: dB
    default: 0
    terms:
      low:
      - trap
      - 0
      - 0
      - 3
      - 10
      medium:
      - tri
      - 3
      - 10
      - 20
      high:
      - trap
      - 10
      - 20
      - 40
      - 40
  sound_type_danger:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: danger degree 0..1 of the sound type (config/audio_types.yaml)
      terms:
        kind: requirement
        text: safe ≤ 0.1 (keyboard 0, fan 0, walking 0.1), suspicious peak 0.4 (unknown 0.3), dangerous ≥ 0.7 (scream 0.8,
          glass / alarm 0.9) — the supervisor's danger examples (TOD-44)
    default: 0
    terms:
      safe:
      - trap
      - 0
      - 0
      - 0.1
      - 0.4
      suspicious:
      - tri
      - 0.1
      - 0.4
      - 0.7
      dangerous:
      - trap
      - 0.4
      - 0.7
      - 1
      - 1
  keyword_danger:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: highest grade of the danger words heard 0..1 (config/danger_words.yaml)
      terms:
        kind: requirement
        text: term peaks = the dictionary grades alarming 0.4 / dangerous 0.7 / critical 1.0 (supervisor's graded dictionary,
          TOD-44)
    default: 0
    terms:
      none:
      - trap
      - 0
      - 0
      - 0.1
      - 0.4
      alarming:
      - tri
      - 0.1
      - 0.4
      - 0.7
      dangerous:
      - tri
      - 0.4
      - 0.7
      - 1.0
      critical:
      - trap
      - 0.7
      - 1.0
      - 1
      - 1
  speaker_unknown:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: 'speaker identification outcome as a number: known 0, uncertain 0.5, unknown 1'
      terms:
        kind: design
        text: one term per outcome, peaks at 0 / 0.5 / 1; the verification error widens them (config/uncertainty.yaml speaker_unknown,
          EER)
    default: 0
    terms:
      known:
      - trap
      - 0
      - 0
      - 0.2
      - 0.5
      uncertain:
      - tri
      - 0.2
      - 0.5
      - 0.8
      unknown:
      - trap
      - 0.5
      - 0.8
      - 1
      - 1
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: equal areas, see gas.risk
    terms:
      low:
      - trap
      - 0
      - 0
      - 0.125
      - 0.375
      medium:
      - tri
      - 0.1
      - 0.35
      - 0.6
      high:
      - tri
      - 0.4
      - 0.65
      - 0.9
      critical:
      - trap
      - 0.625
      - 0.875
      - 1
      - 1
maps:
  speaker_unknown:
    known: 0.0
    uncertain: 0.5
    unknown: 1.0
rules:
- id: A0000
  rule: IF intensity IS low AND sound_type_danger IS safe AND keyword_danger IS none AND speaker_unknown IS known THEN risk
    IS low
  meta:
    source: A4 (TOD-44), modules/hfs/policy.py audio()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: 'max(speech, sound): speech = danger word grade (none / alarming / dangerous / critical → low … critical),
      +1 for an unknown voice at least medium loud with at most alarming words; sound = sound type danger + loud − 1 (dangerous:
      high when loud, medium otherwise; loud suspicious: medium).'
- id: A0001
  rule: IF intensity IS low AND sound_type_danger IS safe AND keyword_danger IS none AND speaker_unknown IS uncertain THEN
    risk IS low
  meta:
    source: A4 (TOD-44), modules/hfs/policy.py audio()
    author: TodaysMonkeyJob
