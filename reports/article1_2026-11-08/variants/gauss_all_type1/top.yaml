version: 2
output: risk
update_sec: 2
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  max_risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: a subsystem's risk 0..1
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      low:
      - gauss
      - 0.0
      - 0.21233045007200477
      medium:
      - gauss
      - 0.35
      - 0.10616522503600238
      high:
      - gauss
      - 0.65
      - 0.10616522503600238
      critical:
      - gauss
      - 1.0
      - 0.21233045007200477
  second_risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: risk of the second active subsystem (TOD-51)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      none:
      - gauss
      - 0.0
      - 0.06369913502160143
      low:
      - gauss
      - 0.175
      - 0.08493218002880192
      medium:
      - gauss
      - 0.35
      - 0.09554870253240214
      high:
      - gauss
      - 1.0
      - 0.42466090014400953
  third_risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: 'risk of the third active subsystem (TOD-51: all three active + one high → critical)'
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      none:
      - gauss
      - 0.0
      - 0.06369913502160143
      active:
      - gauss
      - 1.0
      - 0.7856226652664177
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    terms:
      low:
      - gauss
      - 0.0
      - 0.21233045007200477
      medium:
      - gauss
      - 0.35
      - 0.10616522503600238
      high:
      - gauss
      - 0.65
      - 0.10616522503600238
      critical:
      - gauss
      - 1.0
      - 0.21233045007200477
rules:
- id: T000
  rule: IF max_risk IS low AND second_risk IS none AND third_risk IS none THEN risk IS low
  meta:
    source: TOD-41 supervisor requirements + A9 (TOD-51), modules/hfs/policy.py top()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: The highest subsystem sets the level; a second active subsystem (independent confirmation in the same place
      and time) → one level above it; critical only with evidence — a subsystem at critical, two at high, or all three active
      with one at high — otherwise capped at high.
- id: T001
  rule: IF max_risk IS low AND second_risk IS none AND third_risk IS active THEN risk IS low
  meta:
    source: TOD-41 supervisor requirements + A9 (TOD-51), modules/hfs/policy.py top()
