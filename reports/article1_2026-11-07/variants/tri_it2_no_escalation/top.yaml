version: 2
output: risk
update_sec: 2
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  max_risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: a subsystem's risk 0..1
      terms:
        kind: design
        text: peaks 0.13 / 0.35 / 0.65 / 0.87 = the centroids of the subsystems' output terms, so a subsystem's level maps
          onto the same term; Ruspini partition (monotonicity)
    default: 0
    terms:
      low:
      - trap
      - 0
      - 0
      - 0.15
      - 0.35
      medium:
      - tri
      - 0.15
      - 0.35
      - 0.65
      high:
      - tri
      - 0.35
      - 0.65
      - 0.85
      critical:
      - trap
      - 0.65
      - 0.85
      - 1
      - 1
  second_risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: risk of the second active subsystem (TOD-51)
      terms:
        kind: requirement
        text: 'rows of the TOD-51 matrix (спокійно / низький / середній / високий): none → low over the calm band 0 … 0.15
          (hfs.top.calm_risk: just above the quiet floor 0.13 = the centroid of ''low''), then the medium / high peaks 0.35
          / 0.65 of max_risk; high = two subsystems at high; Ruspini partition'
    default: 0
    terms:
      none:
      - trap
      - 0
      - 0
      - 0
      - 0.15
      low:
      - trap
      - 0
      - 0.15
      - 0.2
      - 0.35
      medium:
      - tri
      - 0.2
      - 0.35
      - 0.65
      high:
      - trap
      - 0.35
      - 0.65
      - 1
      - 1
  third_risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: 'risk of the third active subsystem (TOD-51: all three active + one high → critical)'
      terms:
        kind: requirement
        text: active from the calm band 0.15 (hfs.top.calm_risk); Ruspini partition
    default: 0
    terms:
      none:
      - trap
      - 0
      - 0
      - 0
      - 0.15
      active:
      - trap
      - 0
      - 0.15
      - 1
      - 1
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: equal areas, see gas.risk
    terms:
      low:
      - trap
      - 0
      - 0
      - 0.125
      - 0.375
      medium:
      - tri
      - 0.1
      - 0.35
      - 0.6
      high:
      - tri
      - 0.4
      - 0.65
      - 0.9
      critical:
      - trap
      - 0.625
      - 0.875
      - 1
      - 1
rules:
- id: T000
  rule: IF max_risk IS low AND second_risk IS none AND third_risk IS none THEN risk IS low
  meta:
    source: TOD-41 supervisor requirements + A9 (TOD-51), modules/hfs/policy.py top()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: The highest subsystem sets the level; a second active subsystem (independent confirmation in the same place
      and time) → one level above it; critical only with evidence — a subsystem at critical, two at high, or all three active
      with one at high — otherwise capped at high.
- id: T001
  rule: IF max_risk IS low AND second_risk IS none AND third_risk IS active THEN risk IS low
  meta:
    source: TOD-41 supervisor requirements + A9 (TOD-51), modules/hfs/policy.py top()
