version: 3
output: risk
update_sec: 2
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  max_norm:
    universe:
    - 0
    - 1.2
    - 0.005
    source:
      universe:
        kind: requirement
        text: c / C_crit of config/gases.yaml (NIOSH IDLH, EPA AQI 2024 Hazardous), clipped to 0..1.2 to keep an exceedance
          visible (TOD-42)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    terms:
      safe:
      - gauss
      - 0.0
      - 0.16986436005760383
      moderate:
      - gauss
      - 0.3
      - 0.10616522503600236
      dangerous:
      - gauss
      - 0.6
      - 0.14863131505040336
      critical:
      - gauss
      - 1.2
      - 0.33972872011520755
  second_norm:
    universe:
    - 0
    - 1.2
    - 0.005
    source:
      universe:
        kind: requirement
        text: c / C_crit of the second active gas, same scale as max_norm (TOD-50)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      none:
      - gauss
      - 0.0
      - 0.02123304500720048
      low:
      - gauss
      - 0.07500000000000001
      - 0.07431565752520168
      medium:
      - gauss
      - 0.3
      - 0.10616522503600236
      high:
      - gauss
      - 1.2
      - 0.6369913502160143
  group_index:
    universe:
    - 0
    - 3.6
    - 0.01
    source:
      universe:
        kind: design
        text: Σ c / C_crit of up to three substances at the 1.2 clip
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      below:
      - gauss
      - 0.0
      - 0.8450751912865789
      reached:
      - gauss
      - 3.6
      - 2.2124832897502897
  third_norm:
    universe:
    - 0
    - 1.2
    - 0.005
    source:
      universe:
        kind: requirement
        text: 'c / C_crit of the third active gas (TOD-50: three gases at high → critical)'
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      below:
      - gauss
      - 0.0
      - 0.38219481012960854
      high:
      - gauss
      - 1.2
      - 0.6369913502160143
  dynamics:
    universe:
    - -0.5
    - 0.5
    - 0.005
    source:
      universe:
        kind: expert
        text: ±0.5 C_crit per minute = from clean air to the critical level in 2 minutes; faster changes saturate
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    unit: /min
    default: 0
    terms:
      falling:
      - gauss
      - -0.5
      - 0.3821948101296086
      stable:
      - gauss
      - 0.0
      - 0.04246609001440096
      rising:
      - gauss
      - 0.1
      - 0.053082612518001185
      sharp_rise:
      - gauss
      - 0.5
      - 0.2760295850936062
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: equal areas (0.25) so the centroid is a weighted mean of the term centroids — exact monotonicity with product
          / sum inference (modules/hfs/policy.py); centroids 0.13 / 0.35 / 0.65 / 0.87 are the top level's input peaks
    terms:
      low:
      - trap
      - 0
      - 0
      - 0.125
      - 0.375
      medium:
      - tri
      - 0.1
      - 0.35
      - 0.6
      high:
      - tri
      - 0.4
      - 0.65
      - 0.9
      critical:
      - trap
      - 0.625
      - 0.875
      - 1
      - 1
rules:
- id: G00000
  rule: IF max_norm IS safe AND second_norm IS none AND group_index IS below AND third_norm IS below AND dynamics IS falling
    THEN risk IS low
  meta:
    source: A2 (TOD-42) + A8 (TOD-50), modules/hfs/policy.py gas()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: 'The highest gas (c / C_crit: safe / moderate / dangerous / critical → low / medium / high / critical) sets
      the level; a second active gas → one level above it (co-occurring gases usually mean one incident); critical only with
      evidence — a gas at critical, Σ c / C_crit ≥ 1 inside one effect group (additive mixture rule) or three gases at high
      — otherwise capped at high; a sharp rise → one level up; falling never lowers a level.'
- id: G00001
  rule: IF max_norm IS safe AND second_norm IS none AND group_index IS below AND third_norm IS below AND dynamics IS stable
    THEN risk IS low
  meta:
    source: A2 (TOD-42) + A8 (TOD-50), modules/hfs/policy.py gas()
    author: TodaysMonkeyJob
    added: *id001
    rationale: 'The highest gas (c / C_crit: safe / moderate / dangerous / critical → low / medium / high / critical) sets
      the level; a second active gas → one level above it (co-occurring gases usually mean one incident); critical only with
