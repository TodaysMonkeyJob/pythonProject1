version: 2
output: risk
update_sec: 2
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  max_norm:
    universe:
    - 0
    - 1.2
    - 0.005
    source:
      universe:
        kind: requirement
        text: c / C_crit of config/gases.yaml (NIOSH IDLH, EPA AQI 2024 Hazardous), clipped to 0..1.2 to keep an exceedance
          visible (TOD-42)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    terms:
      safe:
      - gauss
      - 0.0
      - 0.16986436005760383
      moderate:
      - gauss
      - 0.3
      - 0.10616522503600236
      dangerous:
      - gauss
      - 0.6
      - 0.14863131505040336
      critical:
      - gauss
      - 1.2
      - 0.33972872011520755
  dynamics:
    universe:
    - -0.5
    - 0.5
    - 0.005
    source:
      universe:
        kind: expert
        text: ±0.5 C_crit per minute = from clean air to the critical level in 2 minutes; faster changes saturate
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    unit: /min
    default: 0
    terms:
      falling:
      - gauss
      - -0.5
      - 0.3821948101296086
      stable:
      - gauss
      - 0.0
      - 0.04246609001440096
      rising:
      - gauss
      - 0.1
      - 0.053082612518001185
      sharp_rise:
      - gauss
      - 0.5
      - 0.2760295850936062
  mixture_index:
    universe:
    - 0
    - 3.6
    - 0.01
    source:
      universe:
        kind: design
        text: Σ c / C_crit of up to three substances at the 1.2 clip
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      low:
      - gauss
      - 0.0
      - 0.42466090014400953
      noticeable:
      - gauss
      - 0.7
      - 0.14863131505040333
      high:
      - gauss
      - 3.6
      - 2.3356349507920524
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    terms:
      low:
      - gauss
      - 0.0
      - 0.21233045007200477
      medium:
      - gauss
      - 0.35
      - 0.10616522503600238
      high:
      - gauss
      - 0.65
      - 0.10616522503600238
      critical:
      - gauss
      - 1.0
      - 0.21233045007200477
rules:
- id: G000
  rule: IF max_norm IS safe AND dynamics IS falling AND mixture_index IS low THEN risk IS low
  meta:
    source: A2 (TOD-42), modules/hfs/policy.py gas()
    author: TodaysMonkeyJob
    added: &id001 2026-11-06
    rationale: 'All substances as shares of their critical concentration (NIOSH IDLH / EPA Hazardous): max_norm safe / moderate
      / dangerous / critical → low / medium / high / critical (a single substance at c_crit is critical); a sharp rise → one
      level up; mixture index high (Σ c/c_crit ≥ 1) → one level up; falling never lowers a level.'
- id: G001
  rule: IF max_norm IS safe AND dynamics IS falling AND mixture_index IS noticeable THEN risk IS low
  meta:
    source: A2 (TOD-42), modules/hfs/policy.py gas()
    author: TodaysMonkeyJob
    added: *id001
    rationale: 'All substances as shares of their critical concentration (NIOSH IDLH / EPA Hazardous): max_norm safe / moderate
      / dangerous / critical → low / medium / high / critical (a single substance at c_crit is critical); a sharp rise → one
      level up; mixture index high (Σ c/c_crit ≥ 1) → one level up; falling never lowers a level.'
