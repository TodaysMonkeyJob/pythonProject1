- id: T000
  rule: IF risk_gas IS low AND risk_camera IS low AND risk_audio IS low THEN risk IS low
  meta:
    source: supervisor requirements (TOD-41)
    author: TodaysMonkeyJob
    added: &id001 2026-11-06
    rationale: 'One cell of the complete policy table (see the header): any critical → critical, two high → critical, one
      high → high, two medium → high, one medium → medium, all low → low.'
