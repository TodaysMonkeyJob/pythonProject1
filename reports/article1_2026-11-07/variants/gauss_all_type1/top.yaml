version: 1
output: risk
update_sec: 2
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  risk_gas:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: a subsystem's risk 0..1
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      low:
      - gauss
      - 0.0
      - 0.21233045007200477
      medium:
      - gauss
      - 0.35
      - 0.10616522503600238
      high:
      - gauss
      - 0.65
      - 0.10616522503600238
      critical:
      - gauss
      - 1.0
      - 0.21233045007200477
  risk_camera:
