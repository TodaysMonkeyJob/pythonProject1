version: 2
output: risk
update_sec: 1
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  intensity:
    universe:
    - 0
    - 40
    - 0.1
    source:
      universe:
        kind: design
        text: dB above this microphone's own background (modules/audio/intensity.py), 0..40 dB
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    unit: dB
    default: 0
    terms:
      low:
      - gauss
      - 0.0
      - 5.520591701872124
      medium:
      - gauss
      - 10.0
      - 3.609617651224081
      high:
      - gauss
      - 40.0
      - 21.233045007200477
  sound_type_danger:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: danger degree 0..1 of the sound type (config/audio_types.yaml)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      safe:
      - gauss
      - 0.0
      - 0.21233045007200477
      suspicious:
      - gauss
      - 0.4
      - 0.12739827004320287
      dangerous:
      - gauss
      - 1.0
      - 0.38219481012960854
  keyword_danger:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: highest grade of the danger words heard 0..1 (config/danger_words.yaml)
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      none:
      - gauss
      - 0.0
      - 0.21233045007200477
      alarming:
      - gauss
      - 0.4
      - 0.12739827004320287
      dangerous:
      - gauss
      - 0.7
      - 0.12739827004320284
      critical:
      - gauss
      - 1.0
      - 0.12739827004320287
  speaker_unknown:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: 'speaker identification outcome as a number: known 0, uncertain 0.5, unknown 1'
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    default: 0
    terms:
      known:
      - gauss
      - 0.0
      - 0.29726263010080667
      uncertain:
      - gauss
      - 0.5
      - 0.12739827004320287
      unknown:
      - gauss
      - 1.0
      - 0.29726263010080667
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: A6 Gaussian variant of the triangular terms (same centre, same width at μ = 0.5)
    terms:
      low:
      - gauss
      - 0.0
      - 0.21233045007200477
      medium:
      - gauss
      - 0.35
      - 0.10616522503600238
      high:
      - gauss
      - 0.65
      - 0.10616522503600238
      critical:
      - gauss
      - 1.0
      - 0.21233045007200477
maps:
  speaker_unknown:
    known: 0.0
    uncertain: 0.5
    unknown: 1.0
rules:
- id: A0000
  rule: IF intensity IS low AND sound_type_danger IS safe AND keyword_danger IS none AND speaker_unknown IS known THEN risk
    IS low
  meta:
    source: A4 (TOD-44), modules/hfs/policy.py audio()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: 'max(speech, sound): speech = danger word grade (none / alarming / dangerous / critical → low … critical),
      +1 for an unknown voice at least medium loud with at most alarming words; sound = sound type danger + loud − 1 (dangerous:
      high when loud, medium otherwise; loud suspicious: medium).'
- id: A0001
  rule: IF intensity IS low AND sound_type_danger IS safe AND keyword_danger IS none AND speaker_unknown IS uncertain THEN
    risk IS low
  meta:
    source: A4 (TOD-44), modules/hfs/policy.py audio()
