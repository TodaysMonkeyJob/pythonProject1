version: 2
output: risk
update_sec: 1
defuzzification: centroid
operators:
  and: prod
  or: probor
  implication: prod
  aggregation: sum
default_output: 0.0
variables:
  unknown_share:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: requirement
        text: N_unknown / (N_unknown + N_known) in view — a share, not a head count (supervisor, slides 9–11)
      terms:
        kind: expert
        text: 'none ≤ 0.05, part peak 0.3, most peak 0.6, all ≥ 0.95: thirds of the share with 1 known + 1 unknown (0.5) between
          part and most; the identification error widens them (config/uncertainty.yaml unknown_share)'
    default: 0
    terms:
      none:
      - trap
      - 0
      - 0
      - 0.05
      - 0.3
      part:
      - tri
      - 0.05
      - 0.3
      - 0.6
      most:
      - tri
      - 0.3
      - 0.6
      - 0.95
      all:
      - trap
      - 0.6
      - 0.95
      - 1
      - 1
  motion_intensity:
    universe:
    - 0
    - 1
    - 0.001
    source:
      universe:
        kind: design
        text: moving share of the frame 0..1 (adaptive detector, smoothed 5 s)
      terms:
        kind: measured
        text: 'none ≤ 0.003 → low from 0.01: above the detector''s noise on empty scenes (max 0.0066, reports/camera_bench/motion.json);
          medium peak 0.05 = one walking person (40 × 100 px on a 320 × 240 frame = 0.052, tools/camera_bench.py); high from
          0.15 ≈ three people or one close to the camera (expert)'
    default: 0
    terms:
      none:
      - trap
      - 0
      - 0
      - 0.003
      - 0.01
      low:
      - tri
      - 0.003
      - 0.01
      - 0.05
      medium:
      - tri
      - 0.01
      - 0.05
      - 0.15
      high:
      - trap
      - 0.05
      - 0.15
      - 1
      - 1
  activity_time:
    universe:
    - -12
    - 12
    - 0.05
    source:
      universe:
        kind: design
        text: signed hours to the nearest change of the location's schedule, ±12 h (core/schedule.py)
      terms:
        kind: requirement
        text: working / transition (±1 h of an edge) / off hours — the supervisor's unified time notion (TOD-43); schedules
          per object type in config.yaml hfs.camera.schedules
    unit: h
    default: -12
    terms:
      working:
      - trap
      - -12
      - -12
      - -1
      - 0
      transition:
      - tri
      - -1
      - 0
      - 1
      off_hours:
      - trap
      - 0
      - 1
      - 12
      - 12
  risk:
    universe:
    - 0
    - 1
    - 0.005
    source:
      universe:
        kind: design
        text: risk 0..1
      terms:
        kind: design
        text: equal areas, see gas.risk
    terms:
      low:
      - trap
      - 0
      - 0
      - 0.125
      - 0.375
      medium:
      - tri
      - 0.1
      - 0.35
      - 0.6
      high:
      - tri
      - 0.4
      - 0.65
      - 0.9
      critical:
      - trap
      - 0.625
      - 0.875
      - 1
      - 1
rules:
- id: C000
  rule: IF unknown_share IS none AND motion_intensity IS none AND activity_time IS working THEN risk IS low
  meta:
    source: A3 (TOD-43), modules/hfs/policy.py camera()
    author: TodaysMonkeyJob
    added: &id001 2026-11-07
    rationale: 'Strangers matter by their share and by the location''s schedule, not by head count or actions: part → low,
      most → medium, all → medium in working hours and high around / after them; high motion → one level up with anybody unknown
      in view (or after hours with nobody unknown: medium).'
- id: C001
  rule: IF unknown_share IS none AND motion_intensity IS none AND activity_time IS transition THEN risk IS low
  meta:
    source: A3 (TOD-43), modules/hfs/policy.py camera()
    author: TodaysMonkeyJob
