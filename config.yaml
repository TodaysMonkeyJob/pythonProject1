# IoT security system configuration.
# Secrets (Azure keys, dashboard credentials) are NOT stored here — see .env.example.

network:                    # F11: devices of this node, found automatically (no extra programs needed)
  discovery: true           # one pipeline per camera / microphone found; false = the single vision.device + mic
  node_id: null             # this machine; null = hostname
  hub_location: hub         # location of software modules (aggregator, LLM, dashboard)
  devices_path: data/devices.db   # device registry (locations, enabled) — edited on the dashboard Devices page
  discovery_interval_sec: 10      # re-scan: a new camera starts, an unplugged one is marked offline (≤ 15 s)
  discover_cameras: true    # macOS: system_profiler; Linux / Pi: /sys/class/video4linux + picamera2
  discover_mics: true       # sounddevice input devices
  ignore_mics: null         # null = built-in list of virtual devices (Steam Streaming, BlackHole, Zoom, …)
  camera_index_overrides: {}      # {"FaceTime HD Camera": 1} if OpenCV numbers cameras differently
  seed: []                  # defaults for devices seen the first time, e.g.
                            # - {match: "FaceTime", location: room_a}
                            # - {match: "Steam", enabled: false}

locations:                  # F12: per-location state (safe / attention / danger / offline) + notifications
  enabled: true
  seed_file: config/locations.yaml   # optional (see config/locations.example.yaml); edit locations on the dashboard
  attention_window_min: 5   # warnings this recent → attention
  cooldown_min: 2           # danger → attention only after this long without new critical events (or Acknowledge)
  llm_valid_min: 10         # a GPT risk counts for this long
  summary_interval_sec: 1.5 # live location summaries pushed to the dashboard while something changes (≤ 2 s)
  notify:
    path: data/notifications.db
    repeat_min: 5           # the same location + reason at most once per this long
    telegram: true          # only with TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID in .env
    telegram_levels: [danger]

orchestrator:               # main.py (F4)
  child_threads: 2          # CPU threads per module process (OMP / BLAS); a section's `threads` overrides it
  missed_heartbeats: 3      # × 5 s without a heartbeat → restart the module
  startup_grace_sec: 120    # time for a module to load models before heartbeats are required
  max_restart_backoff_sec: 60
  stop_timeout_sec: 10      # graceful stop on Ctrl+C / SIGTERM, then terminate
  log_events: true          # every event → logs/YYYY-MM-DD/events.jsonl
  modules: {}               # per module: {enabled: false} / {target: "pkg.mod:run"} / {subscribe: [...]}
                            # e.g. audio: {target: "modules.audio:run"} for the legacy recorder

logging:
  dir: logs
  max_total_mb: 2048        # total cap for logs/; oldest days are deleted first
  check_every: 100          # re-check the cap after N writes per module

vision:
  enabled: true
  camera: auto              # auto (picamera2 if installed, else OpenCV) | picamera2 | opencv
  device: 0                 # OpenCV: camera index or a video file path (replay)
  replay_realtime: true     # video file: play at `fps` instead of as fast as possible
  replay_loop: true
  resolution: [640, 480]
  fps: 15
  reconnect_max_backoff_sec: 30

  # Motion (every frame): MOG2 background subtraction + contour area filter
  motion_min_area: 800      # px², contours smaller than this are ignored
  motion_history: 300
  motion_var_threshold: 25
  motion_warmup_frames: 30  # background model warm-up, no motion reported
  motion_end_sec: 2.0       # no motion for this long → motion "end"

  # Objects: YOLO + ByteTrack, only on motion or every yolo_interval_sec
  model: yolo11n.pt         # downloaded automatically; on the Pi: python -m modules.vision.export → models/yolo11n_ncnn_model
  imgsz: 320
  confidence_threshold: 0.4
  classes: null             # null = all COCO classes, or a list of class ids
  tracker: bytetrack.yaml
  yolo_interval_sec: 3.0
  threads: 2                # CPU threads per camera pipeline (several cameras must share the cores)
  track_lost_sec: 10.0      # track not seen for this long → "disappeared"
  reid_iou: 0.5             # new track id overlapping a known track of the same class → same object

  scene_timeout_sec: 10     # scene_active → false after this long without motion or objects

  # Shared memory for F2/F3/F7
  shared_buffer: iot_vision # shared memory name (≤ 30 chars on macOS)
  shared_fps: 10            # how often the annotated JPEG / raw frame are refreshed
  jpeg_quality: 80

  log_events: true          # also write camera events to logs/YYYY-MM-DD/camera.jsonl
  stats_interval_sec: 30    # log average FPS
  max_cpu_temp: 80          # °C, reserved for thermal throttling

actions:
  enabled: true
  pose_model: yolo11n-pose.pt   # on the Pi: python -m modules.vision.export --model yolo11n-pose.pt → models/yolo11n-pose_ncnn_model
  imgsz: 320
  pose_conf: 0.4            # person detection confidence of the pose model
  keypoint_conf: 0.4        # keypoints below this are ignored
  action_fps: 5             # pose runs at most this often per active camera, and only when a person is in frame
  idle_fps: 1               # cameras without motion / people are checked only this often (one pooled process)
  threads: 2                # CPU threads for the pose model
  match_iou: 0.3            # pose box ↔ tracked person box
  window_sec: 2.5           # keypoint history per track
  vote_threshold: 0.7       # action confirmed when it wins ≥ 70 % of known frames in the window
  min_votes: 3
  track_lost_sec: 10
  torso_vertical_max: 25    # deg from vertical → upright
  lying_torso_min: 60       # deg from vertical → lying (possible fall)
  standing_knee_min: 160    # deg, straight legs
  sitting_knee_range: [40, 130]   # 40° covers sitting on the floor
  thigh_horizontal_max: 45  # deg from horizontal
  frame_edge_margin: 0.02   # legs hidden + box at the bottom edge = cut by the frame (unknown), else furniture (sitting)
  sitting_height_ratio: 0.75   # bbox height vs this track's standing height
  walking_speed: 0.3        # bbox centre speed, body heights / s
  walking_scale_rate: 0.25  # |d ln(box height)/dt| — walking towards / away from the camera
  speed_window_sec: 1.0
  ankle_alternations_min: 2
  ankle_deadband: 0.03
  mouth_radius: 0.35        # wrist-to-mouth distance in torso lengths: hand reaches the mouth
  mouth_release: 0.6        # hand counts as gone above this (hysteresis)
  mouth_episode_max_sec: 5  # longer contact (head resting on the hands) is not a puff
  smoking_window_sec: 30
  smoking_min_count: 3      # wrist-near-mouth episodes per window → possible_smoking
  gas_window_sec: 60        # gas rise within this window → gas_confirmed
  gas_rise_pct: 0.5
  log_events: true          # write action events to logs/YYYY-MM-DD/actions.jsonl

identity:                   # F3 faces + F9 unified identity registry (faces and voices of the same person)
  enabled: true
  detector_model: models/face_detection_yunet_2023mar.onnx    # python -m modules.vision.face_models
  recognizer_model: models/face_recognition_sface_2021dec.onnx
  registry_path: data/identity.db   # SQLite (WAL): persons, face/voice embeddings, identity_events (audit)
  # Rename / merge / delete people in ONE place: dashboard People page, python -m tools.identity, or
  # python -m tools.enroll --name Oleh --faces <dir> --voice <wav>; every module picks the change up at once.
  legacy_db_path: data/faces/faces.npz   # imported once into an empty registry (python -m tools.migrate_faces_npz)
  location_id: home         # where this device is (events, embeddings, voice ↔ face linking)
  device_id: null           # null = hostname
  identity_fps: 2           # shared frames per second (per active camera) checked for new / unidentified tracks
  idle_fps: 1               # idle cameras
  face_threshold: 0.45      # SFace cosine ≥ this → known person; LFW: 100 % known, 0 % strangers accepted
  unknown_threshold: 0.45   # cosine ≥ this → the same unknown_N as earlier (also after a restart)
  voice_threshold: 0.30     # ECAPA cosine ≥ this → the same voice (python -m tools.calibrate_voice → EER)
  max_embeddings: 20        # voices: longest samples kept per person (centroid = their mean)
  # F14 (TOD-25) — no more duplicate unknowns. Faces: a gallery of prototypes per person, matched by the mean of
  # the top-3 similarities; only good, non-redundant faces are admitted (core/gallery.py).
  max_face_embeddings_per_person: 30
  redundant_similarity: 0.9 # a face this similar to a stored prototype adds nothing → skipped
  gallery_quotas: {min_frontal: 3, max_per_yaw: 8}   # keep variations: ≥ 3 frontal, ≤ 8 left / right
  quality:                  # quality gate before any embedding (modules/vision/face_quality.py)
    min_score: 0.85         # YuNet score
    min_face_size: 80       # px; smaller faces are never embedded (track stays "unidentified")
    min_eye_distance: 30
    truncation_margin: 0.05 # face box + landmarks this far (× face size) inside the frame
    max_yaw: 35             # degrees → good; up to usable_yaw / usable_pitch → usable (match only, never stored)
    max_pitch: 25
    usable_yaw: 50
    usable_pitch: 35
    min_sharpness: 60       # Laplacian variance of the aligned 112 px crop (usable down to usable_sharpness)
    usable_sharpness: 25
    min_brightness: 40
    max_brightness: 220
  # Track-level decisions (modules/vision/track_identity.py)
  collect_sec: 0.5          # tracks that show a face are sampled this often
  strong_threshold: 0.60    # one face this similar decides at once
  vote_ratio: 0.6           # else ≥ 60 % of the track's good faces must match the same person
  min_good_faces_for_unknown: 3   # a new unknown_N needs this many good faces …
  min_unknown_span_sec: 1.0       # … over at least this long, matching nobody
  enrich_min_similarity: 0.30     # an identified track's good faces this similar enter the person's gallery
  continuity_sec: 5         # unknown created this soon after a track of X was lost nearby → dedup bonus
  cannot_link_window: 10    # people face-confirmed in one frame within this window are never merged
  cannot_link_same_location_sec: 0   # > 0: also two cameras of one location within N s (off: they may see one person)
  undo_days: 7              # merges can be undone this long (archived embeddings are purged afterwards)
  store_review_crops: true  # with store_faces off: ≤ 3 crops per unknown for the duplicates review only
  review_crops_dir: data/faces/review
  metrics_path: reports/identity_metrics.json   # daily: unknowns / hour, rejected faces, merges, undos, gallery sizes
  dedup:                    # duplicates job (modules/vision/dedup.py), also "Перевірити зараз" on the People page
    dedup_interval_min: 10
    auto_merge_threshold: 0.62   # gallery score ≥ this and no cannot-link → merged automatically
    review_threshold: 0.42       # between the two → "Possible duplicates" review queue
    continuity_bonus: 0.05
    voice_bonus: 0.05
    stale_unknown_days: 3        # unknowns with < min_good_faces faces, no voice, unseen this long → deleted
    min_good_faces: 3
  link_min_cooccurrences: 3 # a new voice heard while ONE person is alone in view this often → linked to that face
  link_presence_ratio: 0.8  # … for at least 80 % of the speech segment
  retry_sec: 2.0            # retry unknown / not visible tracks this often
  verify_sec: 5.0           # re-check identified people: another person may take the same place (same track id)
  verify_margin: 0.10       # still the same face down to threshold − margin
  switch_confirmations: 2   # consecutive "different face" checks before the label changes
  log_events: true          # write person_identified events to logs/YYYY-MM-DD/identity.jsonl
  detection_score: 0.8      # YuNet face score
  min_face_size: 40         # px
  face_region: 0.6          # face centre must be in the top 60 % of the person box
  box_padding: 0.1          # face centre may lie this much (box fraction) above the box
  max_face_offset: 0.35     # face centre within ±35 % of the box width from its centre
  track_lost_sec: 10
  debug_dir: null           # set a folder to save aligned face crops (debug only — biometric data!)
  store_faces: true         # keep face crops as People page thumbnails (biometric data, stays on the device)
  faces_dir: data/faces/persons   # <faces_dir>/<person_id>/face_*.jpg
  face_images: 10           # face crops kept per person
  unknown_retention_days: 30   # unknown people not seen for this long are deleted (consent / GDPR)
  sync_sec: 5               # how often changes made by the CLI are picked up (bus events apply at once)

audio:
  enabled: true
  mic:                      # modules/audio/mic_controller.py (F4): standby / active microphone
    device: null            # sounddevice input device (null = default)
    sample_rate: 16000
    frame_ms: 30            # webrtcvad frame: 10 / 20 / 30 ms
    vad_aggressiveness: 2   # 0 (lenient) … 3 (strict)
    sound_threshold_db: -35 # dBFS; a louder frame wakes the microphone
    sound_cooldown_sec: 5   # at most one `sound` event per this many seconds
    idle_timeout_sec: 15    # back to standby after this long without scene / loud sound / speech
    preroll_sec: 0.5
    silence_end_sec: 0.8    # a speech segment ends after this much silence
    max_segment_sec: 15     # shorter chunks → text sooner, less work per Whisper call on the Pi
    min_speech_sec: 0.3     # shorter blips are not sent to Whisper
    whisper_backend: azure  # azure: Azure (llm.whisper_deployment, .env keys) — the main path on the Pi, no CPU load;
                            # the local model only when offline / no keys (Azure retried after azure_retry_sec)
                            # azure_only: no local fallback | local: only faster-whisper | none: no transcription
    azure_retry_sec: 300
    local_model: base       # Pi fallback: base ≈ 0.5× real time; small is ~2× more accurate but ≈ real time on a Pi 5
    language: null          # a fixed language (e.g. uk) beats detection; null = detect among `languages`
    languages: [uk, en]     # detection restricted to these (auto-detect over ~100 languages gave ru/cs/pl/… for uk)
    whisper_beam_size: 5
    whisper_prompt: null    # names / domain words to bias spelling, e.g. "Oleh, датчик газу, камера"
    whisper_condition_on_previous_text: false   # true makes Whisper repeat itself after one mistake
    whisper_no_speech_max: 0.6      # drop a segment that is probably silence (no_speech_prob above this …
    whisper_logprob_min: -1.0       # … and avg_logprob below this)
    whisper_compression_max: 2.4    # drop repetitive text ("I don't know, I don't know, …")
    hallucination_phrases: null     # null = built-in list ("дякую за перегляд", "субтитры сделал", …)
    whisper_cpu_threads: 4  # Raspberry Pi 5: 4 cores
    whisper_max_backlog: 2  # skip a segment when 2 newer ones already wait: stays near real time on a slow device
    speaker_id: true        # F9/F10: who said what — diarization + SpeechBrain ECAPA voices in the identity registry
    speaker_model_dir: model/speechbrain
    speaker_device: auto    # auto = MPS on a Mac if it works, else CPU (Pi) | cpu | mps
    speaker_batch_size: 8   # windows per ECAPA pass (big CPU batches are much slower)
    speaker_window_sec: 1.5 # sliding window for speaker embeddings …
    speaker_hop_sec: 0.75   # … and its hop (on a slow Pi 1.5 halves the work)
    speaker_min_speech_sec: 0.8   # windows with less VAD speech are skipped
    speaker_cluster_distance: 0.75   # cosine distance joining windows into one speaker (ECAPA: same ≤ 0.8, other ≥ 0.85)
    speaker_split_similarity: 0.35   # a cluster whose halves are less similar is split into two speakers
    speaker_ambiguous_margin: 0.08   # a window this close to two speakers = overlapping speech → uncertain
    speaker_match_margin: 0.05       # two registry voices this close → uncertain (never the wrong known person)
    min_speaker_sec: 1.0    # a speaker with less speech in the chunk → uncertain, not stored
    speaker_enrich_min_sec: 2.0      # single-speaker chunks this long …
    speaker_enrich_min_snr_db: 10    # … and this clean improve the person's voice profile
    transcript_log: true    # logs/<date>/transcripts.jsonl + transcripts.txt ("[time] [location · device] Name: text")
    device_id: null         # null = mic-<hostname>
  recorder:                 # legacy speech_to_text_whisper.AudioToTextRecorder (modules/audio:run)
    language: en
    api_connection: true
    spinner: false
    log_level: WARNING

gas:
  enabled: true
  mode: replay                 # replay | sensor
  replay_csv: data/gas/replay_demo.csv
  replay_loop: true
  reader: ""                   # sensor mode: "package.module:function" returning 16 R values for Ug 0.0..1.5 V
  sensor_id: gas-1
  gas_poll_sec: 1.0
  classifier_path: models/gas_classifier.joblib    # python -m modules.gas.train
  regressor_path: models/gas_concentration.joblib
  thresholds:                  # concentration, % — placeholders until the real limits are agreed
    ethanol: 5.0
    ammonia: 3.0
    acetone: 5.0
    toluol: 3.0
  rise_rate_threshold: 2.0     # %/min over trend_window_sec → alert (used by F2 gas_confirmed)
  trend_window_sec: 60
  trend_stable_band: 0.2       # |rate| below this (%/min) → trend "stable"
  alert_cooldown_sec: 30       # repeat the same alert reason at most this often

aggregator:                 # F5: JSON snapshots for GPT + CSV of all events
  enabled: true
  global_snapshot_min: 10   # F12: "whole site" digest (one line per active location) for GPT; 0 = off
  llm_format: v2            # F18: GPT gets the fuzzified, trust-tagged JSON view (no raw numbers); digest = v1 text
  export_dir: exports       # everything below lives here (set snapshot_dir / outbox_path to move one part)
  export_csv: true          # <export_dir>/events_YYYY-MM-DD.csv
  write_snapshot_files: true  # <export_dir>/snapshots/*.json; the SQLite queue read by F6: <export_dir>/outbox.db
  snapshot_interval_sec: 60 # regular snapshot, only if the scene is active or something changed
  max_snapshot_bytes: 2048  # token budget: details are dropped until the JSON fits
  max_text_chars: 200       # per transcript
  immediate_actions: [possible_smoking, lying]   # besides any severity=critical event
  unknown_alert_hours: null # e.g. ["22:00", "06:00"]: an unknown person then triggers a snapshot
  immediate_cooldown_sec: 3 # at most one critical snapshot per this many seconds (later ones are batched)
  # GPT gets only the text digest (outbox.digest, ~100 tokens); nothing below is ever sent.
  incidents:                # local archive per critical situation for later human analysis
    enabled: true
    dir: exports/incidents  # <id>.zip: summary.txt, incident.json, events.jsonl, frames/*.jpg
    context_sec: 120        # events before the trigger
    post_sec: 15            # keep collecting after the trigger (extended by further critical events)
    pre_frames_sec: 30      # annotated camera frames before the trigger …
    frame_interval_sec: 2   # … one every 2 s
    max_frames: 40
    max_total_mb: 1024      # oldest archives are deleted above this

llm:                        # F6: GPT analysis of snapshot digests (Azure OpenAI, keys in .env)
  enabled: true
  gpt_deployment: gpt-4.1-mini   # Azure deployment name; "gpt-4" (= gpt-4.1) gives the same decisions at ~5.6× the cost
  whisper_deployment: whisper
  prompt: security_analyst  # prompts/<name>.md
  prompts_dir: prompts
  temperature: 0.2
  max_output_tokens: 300
  min_llm_interval_sec: 300 # regular snapshots at most this often (critical ones immediately)
  poll_sec: 1.0
  request_timeout: 30
  max_retries: 1            # SDK retries; the worker backs off itself
  max_backoff_sec: 300      # offline / 429 / 5xx: wait 2, 4, 8 … up to this, snapshots stay pending
  max_attempts: 3           # invalid answers before a snapshot is given up (status failed)
  price_per_1k_input: 0.0004     # USD, gpt-4.1-mini list price — update to your Azure price list
  price_per_1k_output: 0.0016
  # AZURE_OPENAI_API_VERSION set → AzureOpenAI client (endpoint = https://<resource>.openai.azure.com/);
  # not set → v1 endpoint https://<resource>.openai.azure.com/openai/v1/

trust:                      # F16 (TOD-27): fuzzy trust degree on every evidence event (orchestrator router)
  enabled: true
  fuzzy_config: config/fuzzy.yaml   # trust section: base values, source / asr / identity rules, claim patterns

envelope:                   # F17 (TOD-28): fuzzy risk corridor around GPT decisions (LLM worker)
  enabled: true             # parameters: envelope section of trust.fuzzy_config (θ, levels, confirmation rules)
  log: true                 # every decision with all intermediate values → logs/<date>/envelope.jsonl

dashboard:                  # F7: http://<pi-ip>:8000 (login DASHBOARD_USER / DASHBOARD_PASS from .env)
  enabled: true
  host: 0.0.0.0             # without DASHBOARD_USER / DASHBOARD_PASS the server only listens on 127.0.0.1
  port: 8000
  dashboard_fps: 8          # /video MJPEG frames per second (single-camera link)
  grid_fps: 4               # F13 control room: small 320 px frames per visible camera tile (one WebSocket per page)
  focus_fps: 10             # … the enlarged camera at full size
  history_events: 200       # sent to a browser on connect, from logs/<date>/events.jsonl
