# A4 (TOD-44) level-1 subsystem "audio" of the autonomous hierarchical fuzzy system (modules/hfs) → risk 3.
# Explain a case: python -m modules.hfs audio keyword_danger=1 intensity=8
#
# Inputs (UA terms in comments):
#   intensity          low (низька) · medium (середня) · high (висока) — dB above this microphone's background
#   sound_type_danger  safe (безпечний) · suspicious (підозрілий) · dangerous (небезпечний) — config/audio_types.yaml
#   keyword_danger     none (немає) · alarming (тривожні) · dangerous (небезпечні) · critical (критичні)
#                      — config/danger_words.yaml
#   speaker_unknown    known (відомий) · uncertain (невизначений) · unknown (невідомий) — speaker identification
#
# Complete rule table (3 × 3 × 4 × 3 = 108 rules, A<intensity><type><keywords><speaker> = term indices) of
# modules/hfs/policy.py audio(): max(keyword grade (+1 for an unknown voice with at most alarming words),
# sound danger + loud − 1). The issue's examples hold (policy.py). Ruspini terms + product / sum inference →
# exactly monotonic (reports/surfaces/).
version: 2
output: risk
update_sec: 1
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}   # with the complete table: exactly monotonic
default_output: 0.0

variables:
  intensity:                       # dB above the microphone's background (modules/audio/intensity.py), smoothed 2 s
    universe: [0, 40, 0.1]
    unit: dB
    default: 0
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      low: [trap, 0, 0, 3, 10]
      medium: [tri, 3, 10, 20]     # a voice in a quiet room ≈ +10–15 dB
      high: [trap, 10, 20, 40, 40] # shouting, a bang ≈ +20 dB and more
  sound_type_danger:               # danger of the classified sound type (config/audio_types.yaml), 0 without a model
    universe: [0, 1, 0.005]
    default: 0
    terms:
      safe: [trap, 0, 0, 0.1, 0.4]
      suspicious: [tri, 0.1, 0.4, 0.7]
      dangerous: [trap, 0.4, 0.7, 1, 1]
  keyword_danger:                  # highest grade of the danger words heard (0.4 alarming, 0.7 dangerous, 1 critical)
    universe: [0, 1, 0.005]
    default: 0
    terms:
      none: [trap, 0, 0, 0.1, 0.4]
      alarming: [tri, 0.1, 0.4, 0.7]
      dangerous: [tri, 0.4, 0.7, 1.0]
      critical: [trap, 0.7, 1.0, 1, 1]
  speaker_unknown:                 # 0 = known voice (or nobody spoke), 0.5 = uncertain, 1 = unknown voice
    universe: [0, 1, 0.005]
    default: 0
    terms:
      known: [trap, 0, 0, 0.2, 0.5]
      uncertain: [tri, 0.2, 0.5, 0.8]
      unknown: [trap, 0.5, 0.8, 1, 1]
  risk:                            # same as the top level's output: equal areas (0.25), centroids ≈ 0.13 / 0.35 /
    universe: [0, 1, 0.005]        # 0.65 / 0.87 = the peaks of the top level's input terms
    terms:
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

maps:                              # sound types → danger live in config/audio_types.yaml, words in config/danger_words.yaml
  speaker_unknown: {known: 0.0, uncertain: 0.5, unknown: 1.0}

rules:
  - id: A0000
    rule: "IF intensity IS low AND sound_type_danger IS safe AND keyword_danger IS none AND speaker_unknown IS known THEN risk IS low"
    meta: &policy {source: "A4 (TOD-44), modules/hfs/policy.py audio()", author: TodaysMonkeyJob,
                   added: 2026-11-07, rationale: "max(speech, sound): speech = danger word grade (none / alarming / dangerous / critical → low … critical), +1 for an unknown voice at least medium loud with at most alarming words; sound = sound type danger + loud − 1 (dangerous: high when loud, medium otherwise; loud suspicious: medium)."}
