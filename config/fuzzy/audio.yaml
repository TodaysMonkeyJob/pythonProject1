# A1 (TOD-41) level-1 subsystem "audio" of the autonomous hierarchical fuzzy system (modules/hfs) → risk 3.
# Explain a case: python -m modules.hfs audio danger_keywords=1 sound_level=0.8
# A4 (TOD-44) adds the sound type from the noise stage and refines the keyword grades.
#
# Complete rule table (3 × 3 × 3 × 3 = 81 rules, A<level><type><keywords><speaker> = term indices) of
# modules/hfs/policy.py audio(): level = max(keywords, sound type) + loud + unknown voice.
version: 1
output: risk
update_sec: 1
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}   # with the complete table: exactly monotonic
default_output: 0.0

variables:
  sound_level:                     # loudest sound in the window: (dBFS + 60) / 60, clamped to 0..1
    universe: [0, 1, 0.005]
    default: 0
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      quiet: [trap, 0, 0, 0.25, 0.45]
      normal: [tri, 0.25, 0.45, 0.7]
      loud: [trap, 0.45, 0.7, 1, 1]
  sound_type:                      # danger of the sound class (maps.sound_type); 0 until a classifier labels sounds
    universe: [0, 1, 0.005]
    default: 0
    terms:
      benign: [trap, 0, 0, 0.2, 0.5]
      suspicious: [tri, 0.2, 0.5, 0.8]
      dangerous: [trap, 0.5, 0.8, 1, 1]
  danger_keywords:                 # highest grade of the danger keywords heard in the window (keywords below)
    universe: [0, 1, 0.005]
    default: 0
    terms:
      none: [trap, 0, 0, 0.1, 0.4]
      mild: [tri, 0.1, 0.4, 0.7]
      severe: [trap, 0.4, 0.7, 1, 1]
  speaker_unknown:                 # 0 = known voice (or nobody spoke), 0.5 = uncertain, 1 = unknown voice
    universe: [0, 1, 0.005]
    default: 0
    terms:
      known: [trap, 0, 0, 0.2, 0.5]
      uncertain: [tri, 0.2, 0.5, 0.8]
      unknown: [trap, 0.5, 0.8, 1, 1]
  risk:                            # same as the top level's output: equal areas (0.25), centroids ≈ 0.13 / 0.35 /
    universe: [0, 1, 0.005]        # 0.65 / 0.87 = the peaks of the top level's input terms
    terms:
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

maps:
  sound_type: {speech: 0.1, music: 0.1, noise: 0.2, door: 0.3, bang: 0.6, alarm: 0.9, glass_break: 0.9,
               scream: 1.0, gunshot: 1.0}

# Graded danger keywords (lower-case phrases, matched at a word start; Ukrainian + English). A4 refines them.
keywords:
  1.0: ["допоможіть", "рятуйте", "пожежа", "горить", "вибух", "газ тече", "help me", "fire", "explosion", "gas leak"]
  0.7: ["викличте поліцію", "поліція", "швидку", "він має ніж", "пістолет", "зброя", "call the police",
        "ambulance", "knife", "gun", "weapon"]
  0.4: ["стоп", "відпусти", "не чіпай", "забирайся", "болить", "stop it", "let me go", "get out", "it hurts"]

rules:
  - id: A0000
    rule: "IF sound_level IS quiet AND sound_type IS benign AND danger_keywords IS none AND speaker_unknown IS known THEN risk IS low"
    meta: &policy {source: "initial expert base (TOD-41), modules/hfs/policy.py audio()",
                   author: TodaysMonkeyJob, added: 2026-11-06,
                   rationale: "max(danger keywords none / mild / severe, sound type benign / suspicious / dangerous) + loud + unknown voice: a shouted call for help or a loud dangerous sound → critical, a quiet one → high; distressed words → medium from a known voice, high from an unknown one; an unknown voice or a loud sound alone → medium."}
  - id: A0001
    rule: "IF sound_level IS quiet AND sound_type IS benign AND danger_keywords IS none AND speaker_unknown IS uncertain THEN risk IS low"
    meta: *policy
  - id: A0002
    rule: "IF sound_level IS quiet AND sound_type IS benign AND danger_keywords IS none AND speaker_unknown IS unknown THEN risk IS medium"
    meta: *policy
