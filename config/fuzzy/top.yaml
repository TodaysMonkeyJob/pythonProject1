# A1 (TOD-41) level 2 of the autonomous hierarchical fuzzy system (modules/hfs): risk 1–3 → overall risk.
# Explain a case: python -m modules.hfs top risk_gas=0.87 risk_camera=0.1        (risk_audio missing → 0)
#
# Policy (supervisor requirements; modules/hfs/policy.py top(), every cell checked by tests/test_hfs.py):
#   any subsystem critical → critical;  two high → critical;  one high (others low / medium) → high;
#   two medium → high;  one medium (others low) → medium;  all low → low.
#
# Why a complete table (4 × 4 × 4 = 64 rules, T<gas><camera><audio>, 0 = low … 3 = critical) instead of the six
# policy lines: a Mamdani system with centroid defuzzification is only monotonic for a complete, smooth rule base
# (neighbouring cells differ by at most one level — this policy is) on a Ruspini partition (input terms sum to 1:
# triangles / trapezoids whose edges meet the neighbours' peaks). With product AND / implication, sum aggregation and
# output terms of equal area the centroid is Σ w_r · c_r — a multilinear interpolation of the table, hence exactly
# monotonic: a higher subsystem risk never lowers the overall one (tools/plot_surfaces.py, reports/surfaces/). The
# six-line version with min / max dipped on 9 % of the grid steps and dropped a level on 0.7 %.
#
# Missing subsystem (device offline / no data): its input takes the default 0 (low, μ = 1) — by monotonicity it then
# neither escalates nor blocks anything, the rules work on the remaining subsystems; the result is marked partial.
version: 1
output: risk
update_sec: 2
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}
default_output: 0.0

variables:
  risk_gas: &subsystem_risk        # risk 1; term peaks = centroids of the subsystems' own output terms
    universe: [0, 1, 0.005]
    default: 0
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      low: [trap, 0, 0, 0.15, 0.35]
      medium: [tri, 0.15, 0.35, 0.65]
      high: [tri, 0.35, 0.65, 0.85]
      critical: [trap, 0.65, 0.85, 1, 1]
  risk_camera: *subsystem_risk     # risk 2
  risk_audio: *subsystem_risk      # risk 3
  risk:
    universe: [0, 1, 0.005]
    terms:                         # equal areas (0.25): the centroid is the weighted mean of the term centroids
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

rules:
  - id: T000
    rule: "IF risk_gas IS low AND risk_camera IS low AND risk_audio IS low THEN risk IS low"
    meta: &policy {source: "supervisor requirements (TOD-41)", author: TodaysMonkeyJob, added: 2026-11-06,
                   rationale: "One cell of the complete policy table (see the header): any critical → critical, two high → critical, one high → high, two medium → high, one medium → medium, all low → low."}
  - id: T001
    rule: "IF risk_gas IS low AND risk_camera IS low AND risk_audio IS medium THEN risk IS medium"
    meta: *policy
  - id: T002
    rule: "IF risk_gas IS low AND risk_camera IS low AND risk_audio IS high THEN risk IS high"
