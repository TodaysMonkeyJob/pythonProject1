# A1 (TOD-41) + A9 (TOD-51) level 2 of the autonomous hierarchical fuzzy system (modules/hfs): risk 1–3 → overall.
# Explain a case: python -m modules.hfs top max_risk=0.35 second_risk=0.2        (two active subsystems → high)
#
# Inputs (modules/hfs/top_escalation.py over the gas / camera / audio results of ONE location):
#   max_risk     the highest subsystem risk (an active subsystem held from the last co_window_sec counts too)
#   second_risk  the second ACTIVE subsystem (lower bound of its risk interval above hfs.top.calm_risk; 0 = none)
#   third_risk   a third active subsystem (0 = none)
#
# Policy (modules/hfs/policy.py top(), every cell checked by tests/test_hfs.py): the highest subsystem sets the level;
# a second active subsystem → one level above it; critical only with evidence — a subsystem at critical, two at high,
# or all three active with one at high — otherwise capped at high. The supervisor's rules still hold (any critical →
# critical, two high → critical, one high → high, two medium → high); exceptions (benign combinations inside the
# activity hours, channels of one device, offline subsystems) are applied before the inputs are formed.
#
# Complete table (4 × 4 × 2 = 32 rules, T<max><second><third>) on Ruspini terms with product / sum inference and
# equal-area output terms: the centroid is a multilinear interpolation of the table — exactly monotonic
# (tools/plot_surfaces.py, reports/surfaces/).
#
# Missing subsystem (device offline / no data): it is simply not among the inputs; the result is marked partial and
# the explanation names it.
version: 2
output: risk
update_sec: 2
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}
default_output: 0.0

variables:
  max_risk:                        # term peaks = the centroids of the subsystems' own output terms
    universe: [0, 1, 0.005]
    source:
      universe: {kind: design, text: "a subsystem's risk 0..1"}
      terms: {kind: design, text: "peaks 0.13 / 0.35 / 0.65 / 0.87 = the centroids of the subsystems' output terms, so a subsystem's level maps onto the same term; Ruspini partition (monotonicity)"}
    default: 0
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      low: [trap, 0, 0, 0.15, 0.35]
      medium: [tri, 0.15, 0.35, 0.65]
      high: [tri, 0.35, 0.65, 0.85]
      critical: [trap, 0.65, 0.85, 1, 1]
  second_risk:                     # TOD-51: the second active subsystem's risk (0 = fewer than two active)
    universe: [0, 1, 0.005]
    source:
      universe: {kind: requirement, text: "risk of the second active subsystem (TOD-51)"}
      terms: {kind: requirement, text: "rows of the TOD-51 matrix (спокійно / низький / середній / високий): none → low over the calm band 0 … 0.15 (hfs.top.calm_risk: just above the quiet floor 0.13 = the centroid of 'low'), then the medium / high peaks 0.35 / 0.65 of max_risk; high = two subsystems at high; Ruspini partition"}
    default: 0
    terms:
      none: [trap, 0, 0, 0, 0.15]
      low: [trap, 0, 0.15, 0.2, 0.35]
      medium: [tri, 0.2, 0.35, 0.65]
      high: [trap, 0.35, 0.65, 1, 1]
  third_risk:                      # TOD-51: a third active subsystem (0 = none)
    universe: [0, 1, 0.005]
    source:
      universe: {kind: requirement, text: "risk of the third active subsystem (TOD-51: all three active + one high → critical)"}
      terms: {kind: requirement, text: "active from the calm band 0.15 (hfs.top.calm_risk); Ruspini partition"}
    default: 0
    terms:
      none: [trap, 0, 0, 0, 0.15]
      active: [trap, 0, 0.15, 1, 1]
  risk:
    universe: [0, 1, 0.005]
    source:
      universe: {kind: design, text: "risk 0..1"}
      terms: {kind: design, text: "equal areas, see gas.risk"}
    terms:                         # equal areas (0.25): the centroid is the weighted mean of the term centroids
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

rules:
  - id: T000
    rule: "IF max_risk IS low AND second_risk IS none AND third_risk IS none THEN risk IS low"
    meta: &policy {source: "TOD-41 supervisor requirements + A9 (TOD-51), modules/hfs/policy.py top()", author: TodaysMonkeyJob,
                   added: 2026-11-07, rationale: "The highest subsystem sets the level; a second active subsystem (independent confirmation in the same place and time) → one level above it; critical only with evidence — a subsystem at critical, two at high, or all three active with one at high — otherwise capped at high."}
  - id: T001
    rule: "IF max_risk IS low AND second_risk IS none AND third_risk IS active THEN risk IS low"
    meta: *policy
  - id: T010
    rule: "IF max_risk IS low AND second_risk IS low AND third_risk IS none THEN risk IS medium"
    meta: *policy
  - id: T011
    rule: "IF max_risk IS low AND second_risk IS low AND third_risk IS active THEN risk IS medium"
    meta: *policy
  - id: T020
    rule: "IF max_risk IS low AND second_risk IS medium AND third_risk IS none THEN risk IS medium"
    meta: *policy
  - id: T021
    rule: "IF max_risk IS low AND second_risk IS medium AND third_risk IS active THEN risk IS medium"
    meta: *policy
  - id: T030
    rule: "IF max_risk IS low AND second_risk IS high AND third_risk IS none THEN risk IS medium"
    meta: *policy
  - id: T031
    rule: "IF max_risk IS low AND second_risk IS high AND third_risk IS active THEN risk IS medium"
    meta: *policy
  - id: T100
    rule: "IF max_risk IS medium AND second_risk IS none AND third_risk IS none THEN risk IS medium"
    meta: *policy
  - id: T101
    rule: "IF max_risk IS medium AND second_risk IS none AND third_risk IS active THEN risk IS medium"
    meta: *policy
  - id: T110
    rule: "IF max_risk IS medium AND second_risk IS low AND third_risk IS none THEN risk IS high"
    meta: *policy
  - id: T111
    rule: "IF max_risk IS medium AND second_risk IS low AND third_risk IS active THEN risk IS high"
    meta: *policy
  - id: T120
    rule: "IF max_risk IS medium AND second_risk IS medium AND third_risk IS none THEN risk IS high"
    meta: *policy
  - id: T121
    rule: "IF max_risk IS medium AND second_risk IS medium AND third_risk IS active THEN risk IS high"
    meta: *policy
  - id: T130
    rule: "IF max_risk IS medium AND second_risk IS high AND third_risk IS none THEN risk IS high"
    meta: *policy
  - id: T131
    rule: "IF max_risk IS medium AND second_risk IS high AND third_risk IS active THEN risk IS high"
    meta: *policy
  - id: T200
    rule: "IF max_risk IS high AND second_risk IS none AND third_risk IS none THEN risk IS high"
    meta: *policy
  - id: T201
    rule: "IF max_risk IS high AND second_risk IS none AND third_risk IS active THEN risk IS high"
    meta: *policy
  - id: T210
    rule: "IF max_risk IS high AND second_risk IS low AND third_risk IS none THEN risk IS high"
    meta: *policy
  - id: T211
    rule: "IF max_risk IS high AND second_risk IS low AND third_risk IS active THEN risk IS critical"
    meta: *policy
  - id: T220
    rule: "IF max_risk IS high AND second_risk IS medium AND third_risk IS none THEN risk IS high"
    meta: *policy
  - id: T221
    rule: "IF max_risk IS high AND second_risk IS medium AND third_risk IS active THEN risk IS critical"
    meta: *policy
  - id: T230
    rule: "IF max_risk IS high AND second_risk IS high AND third_risk IS none THEN risk IS critical"
    meta: *policy
  - id: T231
    rule: "IF max_risk IS high AND second_risk IS high AND third_risk IS active THEN risk IS critical"
    meta: *policy
  - id: T300
    rule: "IF max_risk IS critical AND second_risk IS none AND third_risk IS none THEN risk IS critical"
    meta: *policy
  - id: T301
    rule: "IF max_risk IS critical AND second_risk IS none AND third_risk IS active THEN risk IS critical"
    meta: *policy
  - id: T310
    rule: "IF max_risk IS critical AND second_risk IS low AND third_risk IS none THEN risk IS critical"
    meta: *policy
  - id: T311
    rule: "IF max_risk IS critical AND second_risk IS low AND third_risk IS active THEN risk IS critical"
    meta: *policy
  - id: T320
