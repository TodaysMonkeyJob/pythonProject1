# A3 (TOD-43) level-1 subsystem "camera" of the autonomous hierarchical fuzzy system (modules/hfs) → risk 2.
# Explain a case: python -m modules.hfs camera unknown_share=1 activity_time=3 motion_intensity=0.3
#
# No people count (a crowd for an office is normal for a factory) and no action classes (too unreliable for the
# rules; the optional actions mode only logs them). Terms (UA in comments):
#   unknown_share     none (немає) · part (частина) · most (більшість) · all (усі) — N_unknown / N_persons in view
#   motion_intensity  none (немає) · low (низька) · medium (середня) · high (висока) — smoothed moving share of frame
#   activity_time     working (робочий) · transition (перехідний, ±1 h) · off_hours (неробочий) — vs the location schedule
#
# Complete rule table (4 × 4 × 3 = 48 rules, C<unknown><motion><activity> = term indices) of modules/hfs/policy.py
# camera(). The issue's examples hold: all strangers + off hours → high; most strangers + high motion → high; nobody
# unknown + working hours → low; high motion + off hours + some strangers → medium.
# Ruspini terms + product / sum inference → exactly monotonic (policy.py, reports/surfaces/).
version: 2
output: risk
update_sec: 1
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}   # with the complete table: exactly monotonic
default_output: 0.0

variables:
  unknown_share:                   # N_unknown / (N_unknown + N_known) in view (0 = nobody unknown / nobody there)
    universe: [0, 1, 0.005]
    default: 0
    terms:                         # Ruspini partition: μ sums to 1 everywhere; 1 known + 1 unknown = 0.5
      none: [trap, 0, 0, 0.05, 0.3]
      part: [tri, 0.05, 0.3, 0.6]
      most: [tri, 0.3, 0.6, 0.95]
      all: [trap, 0.6, 0.95, 1, 1]
  motion_intensity:                # smoothed moving share of the frame (adaptive detector, busiest camera)
    universe: [0, 1, 0.001]        # a person walking at 3–5 m ≈ 0.02–0.08 of a 640 × 480 frame
    default: 0
    terms:
      none: [trap, 0, 0, 0.003, 0.01]
      low: [tri, 0.003, 0.01, 0.05]
      medium: [tri, 0.01, 0.05, 0.15]
      high: [trap, 0.05, 0.15, 1, 1]
  activity_time:                   # signed hours to the nearest schedule change: < 0 inside, > 0 outside
    universe: [-12, 12, 0.05]
    unit: h
    default: -12
    terms:
      working: [trap, -12, -12, -1, 0]
      transition: [tri, -1, 0, 1]
      off_hours: [trap, 0, 1, 12, 12]
  risk:                            # same as the top level's output: equal areas (0.25), centroids ≈ 0.13 / 0.35 /
    universe: [0, 1, 0.005]        # 0.65 / 0.87 = the peaks of the top level's input terms
    terms:
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

rules:
  - id: C000
    rule: "IF unknown_share IS none AND motion_intensity IS none AND activity_time IS working THEN risk IS low"
    meta: &policy {source: "A3 (TOD-43), modules/hfs/policy.py camera()", author: TodaysMonkeyJob,
                   added: 2026-11-07, rationale: "Strangers matter by their share and by the location's schedule, not by head count or actions: part → low, most → medium, all → medium in working hours and high around / after them; high motion → one level up with anybody unknown in view (or after hours with nobody unknown: medium)."}
