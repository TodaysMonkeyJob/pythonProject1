# A2 (TOD-42) + A8 (TOD-50) level-1 subsystem "gas and PM2.5" of the autonomous hierarchical fuzzy system → risk 1.
# Explain a case: python -m modules.hfs gas max_norm=0.42 second_norm=0.15 group_index=0.42 third_norm=0 dynamics=0
#
# Every substance as a share of its critical concentration, c_norm = c / c_crit (config/gases.yaml: NIOSH IDLH for
# gases, EPA AQI 2024 "Hazardous" for PM2.5), so one rule base serves every gas and smoke. Terms (UA in comments):
#   max_norm     safe (низький) · moderate (середній) · dangerous (високий) · critical (критичний, = 1 at ≥ 1.0)
#   second_norm  none (спокійно / немає) · low · medium · high — the second-highest ACTIVE gas (lower bound above
#                the calm band, modules/hfs/gas_escalation.py)
#   group_index  below · reached (Σ c / c_crit ≥ 1 inside one effect group — the additive mixture rule)
#   third_norm   below · high (a third active gas at high)
#   dynamics     falling (спад) · stable (стабільно) · rising (зростання) · sharp_rise (різке зростання)
#
# Complete rule table (4 × 4 × 2 × 2 × 4 = 256 rules, G<max><second><group><third><dynamics> = term indices) of
# modules/hfs/policy.py gas(): the highest gas sets the level; a second active gas → one level above it; critical only
# with evidence (a gas at critical, group index reached, three gases at high), otherwise capped at high; a sharp rise
# → one level up. The issue's examples hold: NH3 low + CO medium → high; two gases below critical with a group index
# < 1 → never critical; group index ≥ 1 → critical. Ruspini terms + product / sum inference → exactly monotonic
# (policy.py, reports/surfaces/).
version: 3
output: risk
update_sec: 2                      # inference period (sampling: docs/sensors.md; dynamics window: hfs.gas.window_sec)
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}   # with the complete table: exactly monotonic
default_output: 0.0

variables:
  max_norm:                        # max over substances of c / c_crit, clipped to 0..1.2
    universe: [0, 1.2, 0.005]
    source:
      universe: {kind: requirement, text: "c / C_crit of config/gases.yaml (NIOSH IDLH, EPA AQI 2024 Hazardous), clipped to 0..1.2 to keep an exceedance visible (TOD-42)"}
      terms: {kind: requirement, text: "terms at fixed fractions of C_crit 0.1 / 0.3 / 0.6 / 1.0 (TOD-48), critical = 1 at ≥ 1.0 C_crit (TOD-42); Ruspini partition (design, monotonicity)"}
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      safe: [trap, 0, 0, 0.1, 0.3]
      moderate: [tri, 0.1, 0.3, 0.6]
      dangerous: [tri, 0.3, 0.6, 1.0]
      critical: [trap, 0.6, 1.0, 1.2, 1.2]
  second_norm:                     # TOD-50: second-highest c / c_crit among the active gases that count (0: none)
    universe: [0, 1.2, 0.005]
    source:
      universe: {kind: requirement, text: "c / C_crit of the second active gas, same scale as max_norm (TOD-50)"}
      terms: {kind: requirement, text: "rows of the TOD-50 matrix (спокійно / низький / середній / високий): none → low over the calm band 0 … 0.05 C_crit (config/gases.yaml activity.calm_norm, design), then the max_norm fractions 0.1 / 0.3 / 0.6 of C_crit; Ruspini partition"}
    default: 0
    terms:
      none: [trap, 0, 0, 0, 0.05]
      low: [trap, 0, 0.05, 0.1, 0.3]
      medium: [tri, 0.1, 0.3, 0.6]
      high: [trap, 0.3, 0.6, 1.2, 1.2]
  group_index:                     # TOD-50: max over effect groups of Σ c_i / c_crit,i of the counted gases
    universe: [0, 3.6, 0.01]       # three substances at 1.2
    source:
      universe: {kind: design, text: "Σ c / C_crit of up to three substances at the 1.2 clip"}
      terms: {kind: normative, text: "reached = Σ C_i / L_i ≥ 1 within one effect group: the additive mixture rule, OSHA 29 CFR 1910.1000(d)(2)(i) (E_m must not exceed unity); a 0.01 transition so that < 1 never reaches critical (TOD-50)"}
    default: 0
    terms:
      below: [trap, 0, 0, 0.99, 1.0]
      reached: [trap, 0.99, 1.0, 3.6, 3.6]
  third_norm:                      # TOD-50: third-highest c / c_crit among the counted active gases (0: none)
    universe: [0, 1.2, 0.005]
    source:
      universe: {kind: requirement, text: "c / C_crit of the third active gas (TOD-50: three gases at high → critical)"}
      terms: {kind: requirement, text: "high = the max_norm 'dangerous' (високий) peak 0.6 C_crit, from 0.3 (its left foot); Ruspini partition"}
    default: 0
    terms:
      below: [trap, 0, 0, 0.3, 0.6]
      high: [trap, 0.3, 0.6, 1.2, 1.2]
  dynamics:                        # least-squares slope of max_norm per minute over hfs.gas.window_sec (60 s)
    universe: [-0.5, 0.5, 0.005]   # ±0.5 / min = from 0 to the critical level in 2 minutes
    source:
      universe: {kind: expert, text: "±0.5 C_crit per minute = from clean air to the critical level in 2 minutes; faster changes saturate"}
      terms: {kind: expert, text: "rising peaks at 0.1 / min (critical in ~10 min), sharp_rise full from 0.25 / min (critical within ~4 min, less than an evacuation takes); stable ±0.1 / min covers the slope error of a 60 s window (config/uncertainty.yaml dynamics)"}
    unit: "/min"
    default: 0
    terms:
      falling: [trap, -0.5, -0.5, -0.1, 0]
      stable: [tri, -0.1, 0, 0.1]
      rising: [tri, 0, 0.1, 0.25]          # 0.1 / min: critical within ~10 min
      sharp_rise: [trap, 0.1, 0.25, 0.5, 0.5]   # ≥ 0.25 / min: critical within ~4 min
  risk:                            # same as the top level's output: equal areas (0.25), centroids ≈ 0.13 / 0.35 /
    universe: [0, 1, 0.005]        # 0.65 / 0.87 = the peaks of the top level's input terms
    source:
      universe: {kind: design, text: "risk 0..1"}
      terms: {kind: design, text: "equal areas (0.25) so the centroid is a weighted mean of the term centroids — exact monotonicity with product / sum inference (modules/hfs/policy.py); centroids 0.13 / 0.35 / 0.65 / 0.87 are the top level's input peaks"}
    terms:
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

rules:
  - id: G00000
    rule: "IF max_norm IS safe AND second_norm IS none AND group_index IS below AND third_norm IS below AND dynamics IS falling THEN risk IS low"
    meta: &policy {source: "A2 (TOD-42) + A8 (TOD-50), modules/hfs/policy.py gas()", author: TodaysMonkeyJob,
                   added: 2026-11-07, rationale: "The highest gas (c / C_crit: safe / moderate / dangerous / critical → low / medium / high / critical) sets the level; a second active gas → one level above it (co-occurring gases usually mean one incident); critical only with evidence — a gas at critical, Σ c / C_crit ≥ 1 inside one effect group (additive mixture rule) or three gases at high — otherwise capped at high; a sharp rise → one level up; falling never lowers a level."}
