# A2 (TOD-42) level-1 subsystem "gas and PM2.5" of the autonomous hierarchical fuzzy system (modules/hfs) → risk 1.
# Explain a case: python -m modules.hfs gas max_norm=0.6 mixture_index=1.2 dynamics=0
#
# Every substance as a share of its critical concentration, c_norm = c / c_crit (config/gases.yaml: NIOSH IDLH for
# gases, EPA AQI 2024 "Hazardous" for PM2.5), so one rule base serves every gas and smoke. Terms (UA in comments):
#   max_norm       safe (безпечно) · moderate (помірно) · dangerous (небезпечно) · critical (критично, = 1 at ≥ 1.0)
#   mixture_index  low (низький) · noticeable (помітний) · high (високий, Σ c/c_crit ≥ 1)
#   dynamics       falling (спад) · stable (стабільно) · rising (зростання) · sharp_rise (різке зростання)
#
# Complete rule table (4 × 4 × 3 = 48 rules, G<max_norm><dynamics><mixture> = term indices) of modules/hfs/policy.py
# gas(): max_norm safe / moderate / dangerous / critical → low / medium / high / critical; sharp rise → one level up;
# mixture high → one level up. The issue's examples hold: critical → critical; dangerous + rising → high; moderate +
# sharp rise → high; safe + low mixture → low; a high mixture raises the risk although every gas is below critical.
# Ruspini terms + product / sum inference → exactly monotonic (policy.py, reports/surfaces/).
version: 2
output: risk
update_sec: 2                      # inference period (sampling: docs/sensors.md; dynamics window: hfs.gas.window_sec)
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}   # with the complete table: exactly monotonic
default_output: 0.0

variables:
  max_norm:                        # max over substances of c / c_crit, clipped to 0..1.2
    universe: [0, 1.2, 0.005]
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      safe: [trap, 0, 0, 0.1, 0.3]
      moderate: [tri, 0.1, 0.3, 0.6]
      dangerous: [tri, 0.3, 0.6, 1.0]
      critical: [trap, 0.6, 1.0, 1.2, 1.2]
  dynamics:                        # least-squares slope of max_norm per minute over hfs.gas.window_sec (60 s)
    universe: [-0.5, 0.5, 0.005]   # ±0.5 / min = from 0 to the critical level in 2 minutes
    unit: "/min"
    default: 0
    terms:
      falling: [trap, -0.5, -0.5, -0.1, 0]
      stable: [tri, -0.1, 0, 0.1]
      rising: [tri, 0, 0.1, 0.25]          # 0.1 / min: critical within ~10 min
      sharp_rise: [trap, 0.1, 0.25, 0.5, 0.5]   # ≥ 0.25 / min: critical within ~4 min
  mixture_index:                   # Σ c_i / c_crit,i (additive mixture rule of occupational exposure limits)
    universe: [0, 3.6, 0.01]       # three substances at 1.2
    default: 0
    terms:
      low: [trap, 0, 0, 0.3, 0.7]
      noticeable: [tri, 0.3, 0.7, 1.0]
      high: [trap, 0.7, 1.0, 3.6, 3.6]
  risk:                            # same as the top level's output: equal areas (0.25), centroids ≈ 0.13 / 0.35 /
    universe: [0, 1, 0.005]        # 0.65 / 0.87 = the peaks of the top level's input terms
    terms:
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

rules:
  - id: G000
    rule: "IF max_norm IS safe AND dynamics IS falling AND mixture_index IS low THEN risk IS low"
    meta: &policy {source: "A2 (TOD-42), modules/hfs/policy.py gas()", author: TodaysMonkeyJob,
                   added: 2026-11-06, rationale: "All substances as shares of their critical concentration (NIOSH IDLH / EPA Hazardous): max_norm safe / moderate / dangerous / critical → low / medium / high / critical (a single substance at c_crit is critical); a sharp rise → one level up; mixture index high (Σ c/c_crit ≥ 1) → one level up; falling never lowers a level."}
  - id: G001
    rule: "IF max_norm IS safe AND dynamics IS falling AND mixture_index IS noticeable THEN risk IS low"
    meta: *policy
  - id: G002
