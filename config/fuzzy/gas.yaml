# A1 (TOD-41) level-1 subsystem "gas" of the autonomous hierarchical fuzzy system (modules/hfs) → risk 1.
# Explain a case: python -m modules.hfs gas gas_level=0.7 gas_dynamics=0.2
# Inputs are normalised to the gas's critical limit, so one rule base serves every gas (A2 / TOD-42 replaces the
# placeholder limits `gas.thresholds` with NIOSH IDLH / EPA values and adds PM2.5).
#
# Complete rule table (4 × 4 × 3 = 48 rules, G<level><dynamics><mixture> = term indices) of modules/hfs/policy.py gas():
#   level clean / slight / elevated / critical → low / medium / high / critical; sharply rising → one level up;
#   mixture index high → one level up. Ruspini terms + product / sum inference → monotonic (see policy.py).
version: 1
output: risk
update_sec: 2
defuzzification: centroid
operators: {and: prod, or: probor, implication: prod, aggregation: sum}   # with the complete table: exactly monotonic
default_output: 0.0

variables:
  gas_level:                       # max over sensors of concentration / critical limit of that gas
    universe: [0, 2, 0.005]
    terms:                         # Ruspini partition: μ sums to 1 everywhere
      clean: [trap, 0, 0, 0.05, 0.25]
      slight: [tri, 0.05, 0.25, 0.6]
      elevated: [tri, 0.25, 0.6, 1.0]
      critical: [trap, 0.6, 1.0, 2, 2]
  gas_dynamics:                    # rise rate of the main gas, share of its limit per minute
    universe: [-0.5, 0.5, 0.005]
    unit: "/min"
    default: 0
    terms:
      falling: [trap, -0.5, -0.5, -0.1, 0]
      stable: [tri, -0.1, 0, 0.1]
      rising: [tri, 0, 0.1, 0.25]
      sharply_rising: [trap, 0.1, 0.25, 0.5, 0.5]
  mixture_index:                   # Σ C_i / limit_i over the sensors of the location (additive mixture rule)
    universe: [0, 3, 0.01]
    default: 0
    terms:
      low: [trap, 0, 0, 0.3, 0.7]
      medium: [tri, 0.3, 0.7, 1.0]
      high: [trap, 0.7, 1.0, 3, 3]
  risk:                            # same as the top level's output: equal areas (0.25), centroids ≈ 0.13 / 0.35 /
    universe: [0, 1, 0.005]        # 0.65 / 0.87 = the peaks of the top level's input terms
    terms:
      low: [trap, 0, 0, 0.125, 0.375]
      medium: [tri, 0.1, 0.35, 0.6]
      high: [tri, 0.4, 0.65, 0.9]
      critical: [trap, 0.625, 0.875, 1, 1]

rules:
  - id: G000
    rule: "IF gas_level IS clean AND gas_dynamics IS falling AND mixture_index IS low THEN risk IS low"
    meta: &policy {source: "initial expert base (TOD-41), modules/hfs/policy.py gas()",
                   author: TodaysMonkeyJob, added: 2026-11-06,
                   rationale: "gas_level clean / slight / elevated / critical → low / medium / high / critical (a critical concentration is critical on its own); sharply rising → one level up (an early leak); mixture index high (Σ C/L ≥ 1) → one level up; falling never lowers a level."}
  - id: G001
    rule: "IF gas_level IS clean AND gas_dynamics IS falling AND mixture_index IS medium THEN risk IS low"
    meta: *policy
  - id: G002
    rule: "IF gas_level IS clean AND gas_dynamics IS falling AND mixture_index IS high THEN risk IS medium"
    meta: *policy
  - id: G010
    rule: "IF gas_level IS clean AND gas_dynamics IS stable AND mixture_index IS low THEN risk IS low"
    meta: *policy
