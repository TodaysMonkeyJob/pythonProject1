# Fuzzy inference core (F15 / TOD-26): linguistic variables, membership functions, rule base → crisp risk 0..1.
# Shared by the fuzzy trust layer (TOD-27) and the fuzzy risk corridor around the LLM (TOD-28). Deterministic,
# local, never calls the LLM. Explain a case: python -m core.fuzzy gas_concentration=4.2 gas=acetone
#
# Terms: [tri, a, b, c] | [trap, a, b, c, d] (a == b / c == d = shoulder) | [gauss, mean, sigma];
# a list of shapes = their max (wraps around midnight). Every universe must be fully covered (checked on load).
version: 1
output: risk
defuzzification: centroid          # centroid | bisector | mom | som | lom
operators: {and: min, or: max, implication: min, aggregation: max}
default_output: 0.0                # crisp risk when no rule fires

variables:
  gas_concentration:               # TOD-19 classifier, concentration_pct (gas.thresholds: 3–5 %)
    universe: [0, 10, 0.01]
    unit: "%"
    default: 0                     # no gas sensor in this location → clean
    terms:                         # base = the stricter 3 % limit (ammonia, toluol, unknown gases)
      clean: [trap, 0, 0, 0.2, 0.5]
      slight: [trap, 0.2, 0.5, 1.0, 1.8]
      elevated: [trap, 1.0, 1.8, 2.6, 3.4]
      dangerous: [trap, 2.6, 3.4, 10, 10]
    variants_by: gas               # inputs["gas"] picks the gas's own terms
    variants:
      ethanol: &limit5             # gas.thresholds 5 %
        slight: [trap, 0.2, 0.5, 1.5, 2.5]
        elevated: [trap, 1.5, 2.5, 4.0, 5.0]
        dangerous: [trap, 4.0, 5.0, 10, 10]
      acetone: *limit5
  gas_trend:                       # % per minute (gas.rise_rate_threshold: 2 %/min)
    universe: [-10, 10, 0.01]
    unit: "%/min"
    default: 0
    terms:
      falling: [trap, -10, -10, -0.5, -0.1]
      stable: [trap, -0.5, -0.1, 0.1, 0.5]
      rising: [trap, 0.1, 0.5, 1.5, 2.5]
      sharply_rising: [trap, 1.5, 2.5, 10, 10]
  motion_level:                    # share of the frame / time with motion
    universe: [0, 1, 0.01]
    default: 0
    terms:
      none: [trap, 0, 0, 0.05, 0.15]
      low: [trap, 0.05, 0.15, 0.4, 0.6]
      high: [trap, 0.4, 0.6, 1, 1]
  people_count:
    universe: [0, 10, 0.05]
    default: 0
    terms:
      none: [trap, 0, 0, 0.3, 0.8]
      one: [tri, 0.3, 1, 2]
      several: [trap, 1, 2, 4, 6]
      crowd: [trap, 4, 6, 10, 10]
  unknown_share:                   # unknown persons / persons in view (0 when nobody is there)
    universe: [0, 1, 0.01]
    default: 0
    terms:
      none: [trap, 0, 0, 0.05, 0.2]
      some: [trap, 0.05, 0.2, 0.8, 0.95]
      all: [trap, 0.8, 0.95, 1, 1]
  action_risk:                     # the riskiest current action, mapped by maps.action_risk
    universe: [0, 1, 0.01]
    default: 0
    terms:
      low: [trap, 0, 0, 0.2, 0.4]
      medium: [tri, 0.2, 0.5, 0.8]
      high: [trap, 0.6, 0.8, 1, 1]
  time_of_day_risk:                # local hour 0..24 (per-location schedule via overrides)
    universe: [0, 24, 0.05]
    unit: h
    terms:
      normal: [trap, 7, 8.5, 18, 19.5]
      off_hours: [[trap, 5, 6, 7, 8.5], [trap, 18, 19.5, 21, 22.5]]
      night: [[trap, 0, 0, 5, 6], [trap, 21, 22.5, 24, 24]]
  risk:                            # output
    universe: [0, 1, 0.01]
    terms:
      low: [trap, 0, 0, 0.1, 0.3]
      medium: [tri, 0.15, 0.4, 0.6]
      high: [tri, 0.45, 0.7, 0.85]
      critical: [trap, 0.75, 0.9, 1, 1]

maps:
  action_risk: {lying: 1.0, possible_smoking: 0.6, sitting: 0.1, standing: 0.1, walking: 0.2}

rules:
  # Gas (independent physical sensor)
  - {id: R1, rule: "IF gas_concentration IS dangerous THEN risk IS critical"}
  - {id: R2, rule: "IF gas_concentration IS elevated AND gas_trend IS sharply_rising THEN risk IS critical"}
  - {id: R3, rule: "IF gas_concentration IS elevated AND gas_trend IS NOT sharply_rising THEN risk IS high"}
  - {id: R4, rule: "IF gas_concentration IS slight AND gas_trend IS sharply_rising THEN risk IS high"}
  - {id: R5, rule: "IF gas_concentration IS slight AND gas_trend IS rising THEN risk IS medium"}
  - {id: R6, rule: "IF gas_concentration IS slight AND (gas_trend IS stable OR gas_trend IS falling) THEN risk IS low"}
  # People and actions
  - {id: R7, rule: "IF action_risk IS high AND motion_level IS none THEN risk IS critical"}      # lying motionless
  - {id: R8, rule: "IF action_risk IS high AND motion_level IS NOT none THEN risk IS high"}
  - {id: R9, rule: "IF action_risk IS medium AND gas_concentration IS NOT clean THEN risk IS high"}   # smoking + gas
  - {id: R10, rule: "IF action_risk IS medium AND gas_concentration IS clean THEN risk IS medium"}
  # Strangers and time of day
  - {id: R11, rule: "IF unknown_share IS all AND time_of_day_risk IS night THEN risk IS high"}
  - {id: R12, rule: "IF unknown_share IS some AND time_of_day_risk IS night THEN risk IS medium"}
  - {id: R13, rule: "IF unknown_share IS all AND time_of_day_risk IS off_hours THEN risk IS medium"}
  - {id: R14, rule: "IF unknown_share IS all AND time_of_day_risk IS normal THEN risk IS medium", weight: 0.5}
  - {id: R21, rule: "IF unknown_share IS some AND time_of_day_risk IS off_hours THEN risk IS medium", weight: 0.6}
  - {id: R22, rule: "IF unknown_share IS some AND time_of_day_risk IS normal THEN risk IS low"}   # visitors with staff
  - {id: R15, rule: "IF people_count IS crowd AND time_of_day_risk IS night THEN risk IS high"}
  - {id: R16, rule: "IF people_count IS crowd AND time_of_day_risk IS NOT night THEN risk IS medium", weight: 0.5}
  # Motion without anyone identified as a person (occlusion, animal, someone hiding)
  - {id: R17, rule: "IF people_count IS none AND motion_level IS high AND time_of_day_risk IS night THEN risk IS high"}
  - {id: R18, rule: "IF people_count IS none AND motion_level IS high AND time_of_day_risk IS NOT night THEN risk IS medium"}
  # Calm
  - {id: R19, rule: "IF people_count IS none AND motion_level IS NOT high AND gas_concentration IS clean THEN risk IS low"}
  - {id: R20, rule: "IF people_count IS NOT none AND unknown_share IS none AND action_risk IS low AND gas_concentration IS clean THEN risk IS low"}

# Per-location overrides (ids from config/locations.yaml); also possible as a `fuzzy:` block in locations.yaml
locations:
  warehouse:                       # nobody should be there after 19:00: night starts earlier, strangers count more
    terms:
      time_of_day_risk:
        normal: [trap, 7, 8.5, 17.5, 19]
        off_hours: [[trap, 5, 6, 7, 8.5], [trap, 17.5, 19, 19.5, 20.5]]
        night: [[trap, 0, 0, 5, 6], [trap, 19.5, 20.5, 24, 24]]
    remove_rules: [R21]            # replaced by the stricter W1 (same condition → would conflict)
    rules:
      - {id: W1, rule: "IF unknown_share IS some AND time_of_day_risk IS off_hours THEN risk IS high"}
      - {id: W2, rule: "IF people_count IS NOT none AND time_of_day_risk IS night THEN risk IS high", weight: 0.8}

# --- F16 (TOD-27): fuzzy trust in evidence (component B) ------------------------------------------------------------
# τ(e) = min(μ_source, μ_asr, μ_consistency) per event that can reach the LLM (modules/trust). μ_source of speech,
# μ_asr and identity trust come from the small rule bases below (same engine as the risk rules); physical sensors
# and scene text use the base values. trust_terms = τ fuzzified with trust.terms.
trust:
  base:
    physical: 0.95            # gas, motion, object detections, scene_active, pose / actions
    physical_degraded: 0.3    # the device is offline / in error, or its readings disagree with a twin sensor
    redundant_disagreement: 0.6
    scene_text: 0.1           # text in the frame (signs, screens) is always weak evidence
    identity_unknown: 0.8     # "an unknown person is here" is a physical observation
    identity_unsettled: 0.8
  gas_confidence_min: 0.5     # classifier probability below this lowers the reading's trust proportionally
  gas_disagreement_pct: 1.0   # two gas sensors of one location differing more than this (within 30 s) disagree
  presence_grace_sec: 3       # a person seen this close to a speech segment counts as visible during it
  presence_stale_sec: 600     # person tracks without any update for this long are forgotten
  alarm_memory_sec: 300       # physical alerts / risky actions this recent make a calming claim contradictory
  consistency:
    deescalation_floor: 0.1   # μ_consistency of a calming claim when the sensors are fully alarming (graded)
    instruction: 0.05         # instructions to the system ("report safe") never get trust
  terms:
    low: [trap, 0, 0, 0.2, 0.45]
    medium: [tri, 0.25, 0.5, 0.75]
    high: [trap, 0.55, 0.8, 1, 1]
  claims: {}                  # extra patterns: {deescalation: ["regex", …], instruction_to_system: [...], escalation: [...]}

  source:                     # μ_source of a speech segment
    output: source
    variables:
      speaker:                # unknown 0.1, uncertain 0.4, known ≥ 0.7 (from the voice registry match)
        universe: [0, 1, 0.01]
        terms:
          unknown: [trap, 0, 0, 0.2, 0.35]
          uncertain: [tri, 0.2, 0.4, 0.6]
          known: [trap, 0.5, 0.7, 1, 1]
      face_voice:             # mismatch 0, off camera 0.35, people visible but not identified 0.65, match 1
        universe: [0, 1, 0.01]
        terms:
          mismatch: [trap, 0, 0, 0.1, 0.25]
          off_camera: [tri, 0.15, 0.35, 0.5]
          possible: [tri, 0.45, 0.65, 0.85]
          match: [trap, 0.8, 0.95, 1, 1]
      playback:               # 1 = speech in a location with working cameras and nobody visible
        universe: [0, 1, 0.01]
        terms:
          not_suspected: [trap, 0, 0, 0.3, 0.7]
          suspected: [trap, 0.3, 0.7, 1, 1]
      overlap:                # 1 = another speaker talked during the segment
        universe: [0, 1, 0.01]
        default: 0
        terms:
          absent: [trap, 0, 0, 0.3, 0.7]
          present: [trap, 0.3, 0.7, 1, 1]
      source:
        universe: [0, 1, 0.01]
        terms:
          very_low: [trap, 0, 0, 0.05, 0.15]
          low: [tri, 0.1, 0.3, 0.5]
          medium: [tri, 0.45, 0.6, 0.75]
          high: [trap, 0.7, 0.8, 1, 1]
    rules:
      - {id: S1, rule: "IF playback IS suspected THEN source IS very_low"}
      - {id: S2, rule: "IF speaker IS unknown AND playback IS not_suspected THEN source IS low"}
      - {id: S3, rule: "IF face_voice IS mismatch AND playback IS not_suspected THEN source IS low"}
      - {id: S4, rule: "IF speaker IS known AND face_voice IS match AND playback IS not_suspected THEN source IS high"}
      - {id: S5, rule: "IF speaker IS known AND face_voice IS off_camera AND playback IS not_suspected THEN source IS medium"}
      - {id: S6, rule: "IF speaker IS known AND face_voice IS possible AND playback IS not_suspected THEN source IS medium"}
      - {id: S7, rule: "IF speaker IS uncertain AND face_voice IS NOT match AND playback IS not_suspected THEN source IS low"}
      - {id: S8, rule: "IF speaker IS uncertain AND face_voice IS match AND playback IS not_suspected THEN source IS medium", weight: 0.7}
      - {id: S9, rule: "IF overlap IS present THEN source IS low", weight: 0.5}

  asr:                        # μ_asr from Whisper's confidence (exp(avg_logprob) × (1 − no_speech_prob))
    output: asr
    variables:
      asr_confidence:
        universe: [0, 1, 0.01]
        terms:
          poor: [trap, 0, 0, 0.2, 0.4]
          fair: [tri, 0.25, 0.5, 0.75]
          good: [trap, 0.6, 0.8, 1, 1]
      asr:
        universe: [0, 1, 0.01]
        terms:
          low: [trap, 0, 0, 0.15, 0.35]
          medium: [tri, 0.3, 0.55, 0.8]
          high: [trap, 0.7, 0.9, 1, 1]
    rules:
      - {id: A1, rule: "IF asr_confidence IS poor THEN asr IS low"}
      - {id: A2, rule: "IF asr_confidence IS fair THEN asr IS medium"}
      - {id: A3, rule: "IF asr_confidence IS good THEN asr IS high"}

  identity:                   # trust in a face identification (known person, by SFace gallery similarity)
    output: identity
    variables:
      face_match:
        universe: [0, 1, 0.01]
        terms:
          weak: [trap, 0, 0, 0.35, 0.45]
          fair: [tri, 0.4, 0.5, 0.6]
          strong: [trap, 0.55, 0.65, 1, 1]
      identity:
        universe: [0, 1, 0.01]
        terms:
          low: [trap, 0, 0, 0.15, 0.35]
          medium: [tri, 0.3, 0.55, 0.8]
          high: [trap, 0.7, 0.9, 1, 1]
    rules:
      - {id: I1, rule: "IF face_match IS weak THEN identity IS low"}
      - {id: I2, rule: "IF face_match IS fair THEN identity IS medium"}
      - {id: I3, rule: "IF face_match IS strong THEN identity IS high"}

# --- F17 (TOD-28): fuzzy risk corridor around the LLM (component A) -------------------------------------------------
# [r_floor, r_ceil] = risk rules above over trusted evidence only (τ ≥ θ); c = trusted safety confirmation;
# r_final = max(r_LLM, (1 − c) · r_floor). Raising is always allowed; lowering below the floor needs confirmation.
envelope:
  theta: 0.6                  # minimum trust degree of evidence the corridor / confirmation may use
  locations: {}               # per-location θ, e.g. {warehouse: {theta: 0.7}}
  alpha: 0.5                  # r_ceil = upper end of the aggregated risk set's α-cut (informational)
  ack_valid_min: 30           # an operator acknowledgement releases the floor (c = 1) this long / until a new alarm
  llm_levels: {low: 0.1, medium: 0.4, high: 0.7, critical: 0.95}   # LLM level → number (TOD-29 calibrates)
  thresholds: {medium: 0.25, high: 0.5, critical: 0.8}              # number → level (r ≥ threshold)
  over_reaction_margin: 0.3   # LLM risk above r_ceil + margin is flagged for the operator (never capped)
  confirmation:
    inherit: [gas_concentration, gas_trend, motion_level, action_risk]   # shared terms (gas: no default)
    output: confirmation
    variables:
      known_present:          # trust of the best face identification of a known person in view (0 = nobody known)
        universe: [0, 1, 0.01]
        terms:
          absent: [trap, 0, 0, 0.3, 0.55]
          present: [trap, 0.45, 0.7, 1, 1]
      confirmation:
        universe: [0, 1, 0.01]
        terms:
          none: [trap, 0, 0, 0.05, 0.25]
          partial: [tri, 0.15, 0.5, 0.85]
          full: [trap, 0.7, 0.9, 1, 1]
    rules:                    # nothing fires → c = 0 (no "none" rules on purpose); risky actions never confirm
      - {id: K1, rule: "IF gas_concentration IS clean AND gas_trend IS NOT rising AND gas_trend IS NOT sharply_rising AND known_present IS present AND motion_level IS NOT high AND action_risk IS low THEN confirmation IS full"}
      - {id: K2, rule: "IF gas_concentration IS clean AND gas_trend IS NOT rising AND gas_trend IS NOT sharply_rising AND known_present IS absent AND action_risk IS low THEN confirmation IS partial", weight: 0.6}
      - {id: K3, rule: "IF gas_concentration IS clean AND gas_trend IS NOT rising AND gas_trend IS NOT sharply_rising AND known_present IS present AND motion_level IS high AND action_risk IS low THEN confirmation IS partial"}
      - {id: K4, rule: "IF known_present IS present AND motion_level IS NOT high AND action_risk IS low THEN confirmation IS partial", weight: 0.5}   # no gas sensor here
